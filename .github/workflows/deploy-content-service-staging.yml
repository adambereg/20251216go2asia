name: Deploy content-service (staging)

on:
  workflow_dispatch: {}
  push:
    branches:
      - feat/atlas-production-ready
    paths:
      - "apps/content-service/**"
      - "packages/db/**"
      - "packages/sdk/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: content-service-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "8.15.0"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Use repo-root Wrangler (v4) and retry on transient Cloudflare API 5xx.
          CONFIG="apps/content-service/wrangler.toml"
          attempt=1
          max_attempts=3
          while [ $attempt -le $max_attempts ]; do
            echo "Deploy attempt $attempt/$max_attempts for content-service"
            if pnpm exec wrangler deploy --env staging \
              --config "$CONFIG" \
              --var ENVIRONMENT:staging \
              --var VERSION:${GITHUB_SHA}; then
              exit 0
            fi
            echo "Deploy failed (attempt $attempt)."
            if [ $attempt -lt $max_attempts ]; then
              sleep $((attempt * 10))
            fi
            attempt=$((attempt + 1))
          done
          echo "Deploy failed after $max_attempts attempts."
          exit 1

