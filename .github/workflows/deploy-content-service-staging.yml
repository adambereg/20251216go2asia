name: Deploy content-service (staging)

on:
  workflow_dispatch: {}
  push:
    branches:
      - feat/atlas-production-ready
    paths:
      - "apps/content-service/**"
      - "packages/db/**"
      - "packages/sdk/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: content-service-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "8.15.0"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm -C apps/content-service exec -- wrangler deploy --env staging \
            --var ENVIRONMENT:staging \
            --var VERSION:${GITHUB_SHA}

