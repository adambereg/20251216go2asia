name: Deploy Workers (production)

on:
  workflow_dispatch:
    inputs:
      production_gateway_url:
        description: "Production API Gateway base URL"
        required: false
        default: "https://api.go2asia.space"

concurrency:
  group: deploy-workers-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-core:
    name: Deploy ${{ matrix.service }} (production)
    runs-on: ubuntu-latest
    environment:
      name: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            path: apps/auth-service
          - service: content-service
            path: apps/content-service
          - service: points-service
            path: apps/points-service
          - service: referral-service
            path: apps/referral-service
          - service: token-service
            path: apps/token-service

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Deploy worker (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CONFIG="${{ matrix.path }}/wrangler.toml"
          pnpm exec wrangler deploy --env production \
            --config "$CONFIG" \
            --var ENVIRONMENT:production \
            --var VERSION:${{ github.sha }}
      - name: Write deploy manifest
        run: |
          mkdir -p test-results/production
          cat <<'EOF' > "test-results/production/${{ matrix.service }}-deploy.json"
          {
            "service": "${{ matrix.service }}",
            "environment": "production",
            "sha": "${{ github.sha }}",
            "workflowRunId": "${{ github.run_id }}"
          }
          EOF
      - name: Upload deploy manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-${{ matrix.service }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: test-results/production/${{ matrix.service }}-deploy.json

  deploy-gateway:
    name: Deploy api-gateway (production)
    runs-on: ubuntu-latest
    environment:
      name: production
    needs: deploy-core
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Deploy gateway (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy --env production \
            --config "apps/api-gateway/wrangler.toml" \
            --var ENVIRONMENT:production \
            --var VERSION:${{ github.sha }}
      - name: Write gateway deploy manifest
        run: |
          mkdir -p test-results/production
          cat <<'EOF' > "test-results/production/api-gateway-deploy.json"
          {
            "service": "api-gateway",
            "environment": "production",
            "sha": "${{ github.sha }}",
            "workflowRunId": "${{ github.run_id }}"
          }
          EOF
      - name: Upload gateway manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-api-gateway-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: test-results/production/api-gateway-deploy.json

  production-smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    environment:
      name: production
    needs: deploy-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run production gateway smoke
        env:
          STAGING_GATEWAY_URL: ${{ inputs.production_gateway_url }}
          TEST_ARTIFACT_PATH: test-results/production/gateway-smoke.json
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/content_gateway_smoke.mjs
      - name: Upload production smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-gateway-smoke-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: test-results/production/gateway-smoke.json
      - name: Write production summary
        if: always()
        run: |
          {
            echo "## Production Promote Summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| SHA | ${{ github.sha }} |"
            echo "| Gateway URL | ${{ inputs.production_gateway_url }} |"
            echo "| Deploy artifacts | production-deploy-*- ${{ github.run_id }} |"
            echo "| Smoke artifact | production-gateway-smoke-${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
