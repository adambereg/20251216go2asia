name: Seed Neon (staging)

on:
  workflow_dispatch:
    inputs:
      reset:
        description: "Reset content tables before seeding (content only; NOT points/referral/auth)"
        required: false
        type: boolean
        default: false
      skip_ddl:
        description: "Skip DDL apply (seed only)"
        required: false
        type: boolean
        default: false
      skip_seed:
        description: "Skip seeding (DDL only; recommended if you only need migrations/imports)"
        required: false
        type: boolean
        default: true
      organizer_user_id:
        description: "Optional Organizer demo target user id"
        required: false
        type: string
      organizer_user_email:
        description: "Optional Organizer demo target user email (used only if user id is empty)"
        required: false
        type: string

concurrency:
  group: seed-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    name: Seed staging DB (DDL + content)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply DDL (staging)
        if: ${{ inputs.skip_ddl != true }}
        env:
          ENVIRONMENT: staging
          STAGING_DATABASE_URL: "${{ secrets.STAGING_DATABASE_URL }}"
        run: pnpm -C packages/db db:ddl:apply:staging

      - name: Verify Blog DDL applied (to_regclass)
        if: ${{ inputs.skip_ddl != true }}
        env:
          STAGING_DATABASE_URL: "${{ secrets.STAGING_DATABASE_URL }}"
        run: |
          set -euo pipefail
          cd packages/db
          node -e "const u=new URL(process.env.STAGING_DATABASE_URL); console.log('DB host:', u.hostname); console.log('DB name:', u.pathname.replace(/^\\//,''));"
          node -e "const { Client } = require('pg'); const url = process.env.STAGING_DATABASE_URL; if (!url) throw new Error('Missing STAGING_DATABASE_URL'); (async () => { const client = new Client({ connectionString: url, ssl: { rejectUnauthorized: false } }); await client.connect(); const { rows } = await client.query(\"SELECT to_regclass('public.blog_posts') AS blog_posts, to_regclass('public.blog_authors') AS blog_authors, to_regclass('public.blog_tags') AS blog_tags, to_regclass('public.blog_post_tags') AS blog_post_tags, to_regclass('public.media_files') AS media_files\"); console.log(rows[0]); await client.end(); })().catch((e) => { console.error(e); process.exit(1); });"

      - name: Seed content (staging)
        if: ${{ inputs.skip_seed != true }}
        env:
          ENVIRONMENT: staging
          STAGING_DATABASE_URL: "${{ secrets.STAGING_DATABASE_URL }}"
          SEED_RESET: ${{ inputs.reset && '1' || '' }}
        run: pnpm -C packages/db db:seed

      - name: Seed organizer demo content (staging)
        if: ${{ inputs.skip_seed != true }}
        env:
          ENVIRONMENT: staging
          STAGING_DATABASE_URL: "${{ secrets.STAGING_DATABASE_URL }}"
          ORGANIZER_SEED_USER_ID: "${{ inputs.organizer_user_id || vars.ORGANIZER_DEMO_USER_ID }}"
          ORGANIZER_SEED_USER_EMAIL: "${{ inputs.organizer_user_email || vars.ORGANIZER_DEMO_USER_EMAIL }}"
        run: |
          set -euo pipefail
          if [ -n "${ORGANIZER_SEED_USER_ID}" ]; then
            pnpm -C packages/db db:import:organizer-md -- --apply --user-id "${ORGANIZER_SEED_USER_ID}"
          elif [ -n "${ORGANIZER_SEED_USER_EMAIL}" ]; then
            pnpm -C packages/db db:import:organizer-md -- --apply --user-email "${ORGANIZER_SEED_USER_EMAIL}"
          else
            echo "Skipping organizer demo seed: ORGANIZER_DEMO_USER_ID / ORGANIZER_DEMO_USER_EMAIL is not configured."
          fi

      - name: Cleanup old Blog canon data (staging)
        if: ${{ always() && inputs.skip_ddl != true }}
        env:
          ENVIRONMENT: staging
          STAGING_DATABASE_URL: "${{ secrets.STAGING_DATABASE_URL }}"
        run: pnpm -C packages/db db:cleanup:blog

      - name: Import blog markdown (staging)
        if: ${{ always() && inputs.skip_ddl != true }}
        env:
          ENVIRONMENT: staging
          STAGING_DATABASE_URL: "${{ secrets.STAGING_DATABASE_URL }}"
          MEDIA_PUBLIC_BASE_URL: "${{ vars.MEDIA_PUBLIC_BASE_URL }}"
        run: pnpm -C packages/db db:import:blog-md -- --apply

      - name: Verify Blog canon matches DB (staging)
        if: ${{ always() && inputs.skip_ddl != true }}
        env:
          ENVIRONMENT: staging
          STAGING_DATABASE_URL: "${{ secrets.STAGING_DATABASE_URL }}"
        run: pnpm -C packages/db db:verify:blog-canon

      - name: Verify Blog API returns items (staging)
        if: ${{ always() && inputs.skip_ddl != true }}
        run: |
          set -euo pipefail
          curl -fsSL "https://go2asia-api-gateway-staging.fred89059599296.workers.dev/v1/content/blog/posts?limit=1" \
            | node -e 'let d=""; process.stdin.on("data",(c)=>d+=c); process.stdin.on("end",()=>{ const j=JSON.parse(d||"{}"); const n=Array.isArray(j.items)?j.items.length:0; if(n<1){ console.error("Blog API returned no items"); process.exit(1);} console.log("Blog API OK, items=", n); });'



