name: Seed Neon (staging)

on:
  workflow_dispatch:
    inputs:
      reset:
        description: "Reset content tables before seeding (content only; NOT points/referral/auth)"
        required: false
        type: boolean
        default: false
      skip_ddl:
        description: "Skip DDL apply (seed only)"
        required: false
        type: boolean
        default: false
      skip_seed:
        description: "Skip seeding (DDL only; recommended if you only need migrations/imports)"
        required: false
        type: boolean
        default: true

concurrency:
  group: seed-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    name: Seed staging DB (DDL + content)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply DDL (staging)
        if: ${{ inputs.skip_ddl != true }}
        env:
          ENVIRONMENT: staging
          STAGING_DATABASE_URL: "${{ secrets.STAGING_DATABASE_URL }}"
        run: pnpm -C packages/db db:ddl:apply:staging

      - name: Verify Blog DDL applied (to_regclass)
        if: ${{ inputs.skip_ddl != true }}
        env:
          STAGING_DATABASE_URL: "${{ secrets.STAGING_DATABASE_URL }}"
        run: |
          set -euo pipefail
          cd packages/db
          node -e "const u=new URL(process.env.STAGING_DATABASE_URL); console.log('DB host:', u.hostname); console.log('DB name:', u.pathname.replace(/^\\//,''));"
          node - <<'NODE'
          const { Client } = require('pg');
          const url = process.env.STAGING_DATABASE_URL;
          if (!url) throw new Error('Missing STAGING_DATABASE_URL');
          (async () => {
            const client = new Client({ connectionString: url, ssl: { rejectUnauthorized: false } });
            await client.connect();
            const { rows } = await client.query(`
              SELECT
                to_regclass('public.blog_posts')       AS blog_posts,
                to_regclass('public.blog_authors')     AS blog_authors,
                to_regclass('public.blog_tags')        AS blog_tags,
                to_regclass('public.blog_post_tags')   AS blog_post_tags,
                to_regclass('public.media_files')      AS media_files
            `);
            console.log(rows[0]);
            await client.end();
          })().catch((e) => { console.error(e); process.exit(1); });
NODE

      - name: Seed content (staging)
        if: ${{ inputs.skip_seed != true }}
        env:
          ENVIRONMENT: staging
          STAGING_DATABASE_URL: "${{ secrets.STAGING_DATABASE_URL }}"
          SEED_RESET: ${{ inputs.reset && '1' || '' }}
        run: pnpm -C packages/db db:seed

      - name: Import blog markdown (staging)
        if: ${{ inputs.skip_ddl != true }}
        env:
          ENVIRONMENT: staging
          STAGING_DATABASE_URL: "${{ secrets.STAGING_DATABASE_URL }}"
          MEDIA_PUBLIC_BASE_URL: "${{ vars.MEDIA_PUBLIC_BASE_URL }}"
        run: pnpm -C packages/db db:import:blog-md -- --apply



