name: Deploy Workers (staging)

on:
  push:
    branches:
      - '**'          # любые ветки
  workflow_dispatch:   # чтобы можно было запускать вручную


concurrency:
  group: deploy-workers-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db-migrate:
    name: Apply DB DDL (staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply DDL (staging)
        env:
          ENVIRONMENT: staging
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm -C packages/db db:ddl:apply:staging

  deploy-core:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: db-migrate
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            path: apps/auth-service
            url: https://go2asia-auth-service-staging.fred89059599296.workers.dev
            extra_vars: ""
          - service: content-service
            path: apps/content-service
            url: https://go2asia-content-service-staging.fred89059599296.workers.dev
            extra_vars: >-
              --var POINTS_SERVICE_URL:https://go2asia-points-service-staging.fred89059599296.workers.dev
          - service: media-service
            path: apps/media-service
            url: https://go2asia-media-service-staging.fred89059599296.workers.dev
            extra_vars: ""
          - service: points-service
            path: apps/points-service
            url: https://go2asia-points-service-staging.fred89059599296.workers.dev
            extra_vars: ""
          - service: referral-service
            path: apps/referral-service
            url: https://go2asia-referral-service-staging.fred89059599296.workers.dev
            extra_vars: >-
              --var POINTS_SERVICE_URL:https://go2asia-points-service-staging.fred89059599296.workers.dev
          - service: token-service
            path: apps/token-service
            url: https://go2asia-token-service-staging.fred89059599296.workers.dev
            extra_vars: ""
          - service: space-service
            path: apps/space-service
            url: https://go2asia-space-service-staging.fred89059599296.workers.dev
            extra_vars: ""
          - service: reactions-service
            path: apps/reactions-service
            url: https://go2asia-reactions-service-staging.fred89059599296.workers.dev
            extra_vars: ""
          - service: feed-service
            path: apps/feed-service
            url: https://go2asia-feed-service-staging.fred89059599296.workers.dev
            extra_vars: >-
              --var SPACE_SERVICE_URL:https://go2asia-space-service-staging.fred89059599296.workers.dev
              --var REACTIONS_SERVICE_URL:https://go2asia-reactions-service-staging.fred89059599296.workers.dev
          - service: rf-service
            path: apps/rf-service
            url: https://go2asia-rf-service-staging.fred89059599296.workers.dev
            extra_vars: ""

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ ! -d "${{ matrix.path }}" ]; then
            echo "Service directory '${{ matrix.path }}' not found."
            exit 1
          fi
          CONFIG="${{ matrix.path }}/wrangler.toml"
          if [ ! -f "$CONFIG" ]; then
            echo "Wrangler config not found: $CONFIG"
            exit 1
          fi
          attempt=1
          max_attempts=3
          while [ $attempt -le $max_attempts ]; do
            echo "Deploy attempt $attempt/$max_attempts for ${{ matrix.service }}"
            if pnpm exec wrangler deploy --env staging \
              --config "$CONFIG" \
              --var ENVIRONMENT:staging \
              --var VERSION:${{ github.sha }} \
              ${{ matrix.extra_vars }}; then
              exit 0
            fi
            echo "Deploy failed (attempt $attempt)."
            if [ $attempt -lt $max_attempts ]; then
              sleep $((attempt * 10))
            fi
            attempt=$((attempt + 1))
          done
          echo "Deploy failed after $max_attempts attempts."
          exit 1
      - name: Smoke check (ready first)
        run: |
          set -euo pipefail

          URL="${{ matrix.url }}"
          echo "Smoke checking: $URL"

          # Prefer readiness. Keep health/version fallback while older environments converge.
          for path in "/ready" "/health" "/version" "/"; do
            code="$(curl -sS -o /dev/null -w "%{http_code}" "${URL}${path}" || true)"
            echo "GET ${URL}${path} -> ${code}"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
          done

          echo "Smoke check failed: expected HTTP 200 on ${URL} (/ready|/health|/version|/)"
          exit 1

  deploy-gateway:
    name: Deploy api-gateway
    runs-on: ubuntu-latest
    needs: deploy-core
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Deploy gateway (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy --env staging \
            --config "apps/api-gateway/wrangler.toml" \
            --var ENVIRONMENT:staging \
            --var VERSION:${{ github.sha }} \
            --var AUTH_SERVICE_URL:https://go2asia-auth-service-staging.fred89059599296.workers.dev \
            --var CONTENT_SERVICE_URL:https://go2asia-content-service-staging.fred89059599296.workers.dev \
            --var MEDIA_SERVICE_URL:https://go2asia-media-service-staging.fred89059599296.workers.dev \
            --var POINTS_SERVICE_URL:https://go2asia-points-service-staging.fred89059599296.workers.dev \
            --var REFERRAL_SERVICE_URL:https://go2asia-referral-service-staging.fred89059599296.workers.dev \
            --var SPACE_SERVICE_URL:https://go2asia-space-service-staging.fred89059599296.workers.dev \
            --var REACTIONS_SERVICE_URL:https://go2asia-reactions-service-staging.fred89059599296.workers.dev \
            --var FEED_SERVICE_URL:https://go2asia-feed-service-staging.fred89059599296.workers.dev \
            --var RF_SERVICE_URL:https://go2asia-rf-service-staging.fred89059599296.workers.dev
      - name: Smoke check gateway
        run: |
          set -euo pipefail
          URL="https://go2asia-api-gateway-staging.fred89059599296.workers.dev"
          for path in "/ready" "/health" "/version" "/"; do
            code="$(curl -sS -o /dev/null -w "%{http_code}" "${URL}${path}" || true)"
            echo "GET ${URL}${path} -> ${code}"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
          done
          echo "Gateway smoke failed"
          exit 1

  gateway-smoke:
    name: Gateway smoke
    runs-on: ubuntu-latest
    needs: deploy-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run gateway smoke
        env:
          STAGING_GATEWAY_URL: https://go2asia-api-gateway-staging.fred89059599296.workers.dev
          STAGING_TEST_JWT: ${{ secrets['STAGING_TEST_JWT'] }}
          TEST_ARTIFACT_PATH: test-results/staging/gateway-smoke.json
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/content_gateway_smoke.mjs
      - name: Upload gateway smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-smoke-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: test-results/staging/gateway-smoke.json

  contract-tests:
    name: Content contract tests
    runs-on: ubuntu-latest
    needs: gateway-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run content public contract
        env:
          STAGING_GATEWAY_URL: https://go2asia-api-gateway-staging.fred89059599296.workers.dev
          OPENAPI_BUNDLE_PATH: docs/openapi/openapi.bundle.yaml
          TEST_ARTIFACT_PATH: test-results/staging/content-public-contract.json
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/contract/content_public_contract.mjs
      - name: Upload contract artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-contract-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: test-results/staging/content-public-contract.json
      - name: Write staging summary
        if: always()
        run: |
          {
            echo "## Staging Deploy Summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| SHA | ${{ github.sha }} |"
            echo "| Gateway URL | https://go2asia-api-gateway-staging.fred89059599296.workers.dev |"
            echo "| Gateway smoke artifact | gateway-smoke-${{ github.run_id }} |"
            echo "| Content contract artifact | content-contract-${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  media-cutover-smoke:
    name: Media cutover smoke
    runs-on: ubuntu-latest
    needs: gateway-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run media cutover smoke
        env:
          STAGING_GATEWAY_URL: https://go2asia-api-gateway-staging.fred89059599296.workers.dev
          STAGING_TEST_JWT: ${{ secrets['STAGING_TEST_JWT'] }}
          TEST_ARTIFACT_PATH: test-results/staging/media-cutover-smoke.json
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/media_gateway_cutover_smoke.mjs
      - name: Upload media cutover artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-cutover-smoke-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: test-results/staging/media-cutover-smoke.json



