name: API Smoke (staging)

on:
  workflow_dispatch:
    inputs:
      staging_gateway_url:
        description: "Staging API Gateway base URL"
        required: false
        default: "https://go2asia-api-gateway-staging.fred89059599296.workers.dev"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run gateway smoke
        env:
          STAGING_GATEWAY_URL: ${{ inputs.staging_gateway_url }}
          STAGING_TEST_JWT: ${{ secrets['STAGING_TEST_JWT'] }}
          TEST_ARTIFACT_PATH: test-results/manual/gateway-smoke.json
        run: node scripts/content_gateway_smoke.mjs
      - name: Upload gateway smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-gateway-smoke-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: test-results/manual/gateway-smoke.json



