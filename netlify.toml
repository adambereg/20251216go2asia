[build]
  command = "pnpm turbo build --filter=@go2asia/pwa-shell"
  publish = "apps/go2asia-pwa-shell/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "8"

[context.production]
  command = "pnpm turbo build --filter=@go2asia/pwa-shell"
  publish = "apps/go2asia-pwa-shell/.next"

[context.staging]
  command = "pnpm turbo build --filter=@go2asia/pwa-shell"
  publish = "apps/go2asia-pwa-shell/.next"
  [context.staging.environment]
    NEXT_PUBLIC_API_URL = "https://go2asia-api-gateway-staging.fred89059599296.workers.dev"
    NEXT_PUBLIC_SPACE_PHASE1_PROFILE_ID = "user_3BlK8FjaNuSTgxcgX8Lnkeot3Wy"

[context.deploy-preview]
  command = "pnpm turbo build --filter=@go2asia/pwa-shell"
  publish = "apps/go2asia-pwa-shell/.next"
  [context.deploy-preview.environment]
    NEXT_PUBLIC_API_URL = "https://go2asia-api-gateway-staging.fred89059599296.workers.dev"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
