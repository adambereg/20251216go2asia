        badgeCode:
          type: string
        category:
          nullable: true
          type: string
        description:
          nullable: true
          type: string
        iconKey:
          nullable: true
          type: string
        sourceId:
          nullable: true
          type: string
        sourceType:
          nullable: true
          type: string
        title:
          type: string
      required:
        - badgeCode
        - title
        - awardedAt
      type: object
    UserBadgesResponse:
      properties:
        items:
          items:
            $ref: "#/components/schemas/UserBadgeItem"
          type: array
      required:
        - items
      type: object
    UserBalance:
      properties:
        balance:
          type: integer
        updatedAt:
          format: date-time
          type: string
        userId:
          type: string
      required:
        - userId
        - balance
        - updatedAt
      type: object
    UserRow:
      properties:
        clerk_id:
          type: string
        created_at:
          format: date-time
          type: string
        email:
          format: email
          type: string
        id:
          type: string
        role:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - clerk_id
        - email
        - role
        - created_at
        - updated_at
      type: object
    WalletStatus:
      properties:
        isActive:
          type: boolean
      required:
        - isActive
      type: object
    WalletSummaryResponse:
      properties:
        availablePoints:
          description: Ledger-projected spendable Points bucket.
          type: integer
        estimatedUnlockablePoints:
          description: Slice 1 estimate; currently equals lockedPoints.
          type: integer
        lockedPoints:
          description: Ledger-projected locked Points bucket.
          type: integer
        networkPoints:
          description: Ledger-projected network-generated Points bucket.
          type: integer
        proStatus:
          $ref: "#/components/schemas/WalletStatus"
        totalPoints:
          description: Sum of availablePoints, lockedPoints and networkPoints.
          type: integer
        vipStatus:
          $ref: "#/components/schemas/WalletStatus"
      required:
        - availablePoints
        - lockedPoints
        - networkPoints
        - totalPoints
        - estimatedUnlockablePoints
        - vipStatus
        - proStatus
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    GatewayAuth:
      description: Service JWT issued/forwarded by API Gateway to authenticate gateway-origin requests
      in: header
      name: X-Gateway-Auth
      type: apiKey
    ServiceAuth:
      bearerFormat: JWT
      description: Service-to-service JWT (M3)
      scheme: bearer
      type: http
info:
  contact:
    email: fred8909599296@gmail.com
    name: Go2Asia Dev Team
  description: |
    Unified API specification for all Go2Asia backend microservices. This file defines the global schema and shared components. Each microservice extends this file via modular OpenAPI fragments.
  title: Go2Asia Platform API
  version: 0.1.0
openapi: 3.1.0
paths:
  /internal/points/add:
    post:
      description: |
        Idempotency policy (M3): - `externalId` is required and MUST be globally unique for Points Service. - If `externalId` already exists and the incoming ledger write does not match the previously accepted write => 409 Conflict and the event MUST be logged as an integration error. - `sourceService` is derived from the authenticated service JWT subject, not supplied by the caller. - `sourceEventId` is an optional caller-supplied audit pointer to the originating domain event or record.
        Limits policy (M3): - Per-action limits and a simple configurable per-user velocity cap are applied inside Points Service.
      operationId: addPoints
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPointsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddPointsResponse"
          description: OK (applied or duplicate)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
      security:
        - ServiceAuth: []
      summary: Add points to a user (idempotent)
      tags:
        - internal
  /internal/points/badges/award:
    post:
      description: |
        Service-to-service badge award endpoint. Important: - Badge awards are off-chain achievements only. - Awarding a badge MUST NOT create a points transaction or mutate a points balance. - `badgeCode`, `sourceType`, and `sourceId` are required to support auditability and idempotent award semantics. - Repeating the same award returns `applied=false`; attempting to reuse the same badge for the same user with a different source returns 409 Conflict.
      operationId: awardBadge
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwardBadgeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwardBadgeResponse"
          description: OK (applied or duplicate)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
      security:
        - ServiceAuth: []
      summary: Award an off-chain badge to a user (idempotent)
      tags:
        - internal
  /internal/referral/generate-code:
    post:
      description: Idempotent upsert of referral code for the given userId.
      operationId: generateReferralCode
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCodeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateCodeResponse"
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
      security:
        - ServiceAuth: []
      summary: Ensure referral code exists for user (idempotent)
      tags:
        - internal
  /internal/referral/link:
    post:
      description: |
        Invariant (M3): referee can have at most one referrer (L1 link).
      operationId: linkReferral
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkReferralRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkReferralResponse"
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
      security:
        - ServiceAuth: []
      summary: Link referee to referrer by referral code
      tags:
        - internal
  /internal/referral/mark-first-login:
    post:
      description: |
        Service-to-service endpoint to mark referral relation as active by setting first_login_at for the given userId (referee).
      operationId: markReferralFirstLogin
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkFirstLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkFirstLoginResponse"
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
      security:
        - ServiceAuth: []
      summary: Mark referee first login (idempotent)
      tags:
        - internal
  /v1/auth/webhook/clerk:
    post:
      description: |
        Receives Clerk events (e.g. user.created, user.updated). Used for integration (points/referral code). Signature verification may be relaxed in early milestones.
      operationId: clerkWebhook
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
        required: true
      responses:
