        - description: Zero-based offset for pagination.
          in: query
          name: offset
          required: false
          schema:
            minimum: 0
            type: integer
        - description: 1-based page alias. Ignored when `offset` is provided.
          in: query
          name: page
          required: false
          schema:
            minimum: 1
            type: integer
        - description: Country slug or country id (alias of `country_id`).
          in: query
          name: country
          required: false
          schema:
            type: string
        - description: Country id alias for `country`.
          in: query
          name: country_id
          required: false
          schema:
            type: string
        - description: City slug or city id (alias of `city_id`).
          in: query
          name: city
          required: false
          schema:
            type: string
        - description: City id alias for `city`.
          in: query
          name: city_id
          required: false
          schema:
            type: string
        - description: Event category filter.
          in: query
          name: category
          required: false
          schema:
            type: string
        - description: Include events whose active window ends after this timestamp.
          in: query
          name: date_from
          required: false
          schema:
            format: date-time
            type: string
        - description: Include events whose start is before this timestamp.
          in: query
          name: date_to
          required: false
          schema:
            format: date-time
            type: string
        - description: Price filter. Defaults to `any`.
          in: query
          name: price
          required: false
          schema:
            enum:
              - free
              - paid
              - any
            type: string
        - description: Verification filter. Defaults to `any`.
          in: query
          name: verified
          required: false
          schema:
            enum:
              - "true"
              - "false"
              - any
            type: string
        - description: Search query over event title and description.
          in: query
          name: q
          required: false
          schema:
            type: string
        - description: Legacy alias for `q`.
          in: query
          name: search
          required: false
          schema:
