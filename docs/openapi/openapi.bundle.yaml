servers:
  - description: Production API Gateway
    url: https://api.go2asia.space
  - description: Staging Environment
    url: https://staging.api.go2asia.space
tags:
  - description: User authentication & session management
    name: auth
  - description: User profiles and account data
    name: users
  - description: Posts, reactions, media metadata
    name: content
  - description: Countries, cities, places, guides
    name: atlas
  - description: Events, schedules and calendars
    name: pulse
  - description: Referral system and invite tracking
    name: referral
  - description: Points, G2A token and NFT logic
    name: tokenomics
  - description: Service health checks
    name: health
  - description: Media/Storage (R2) endpoints (Phase 2.2)
    name: media
  - description: Debug endpoints (no secrets)
    name: debug
  - name: guru
  - description: Points balance and ledger operations
    name: points
  - description: Economy wallet buckets and status summary
    name: wallet
  - description: Off-chain badge catalog and user badge awards
    name: badges
  - description: Service-to-service APIs (authenticated)
    name: internal
  - description: Quest runtime baseline contract.
    name: quests
    x-go2asia-quest-rf:
      visitPartnerSeam:
        stepType: visit_partner
        targetIdPolicy:
          opaque: true
          requiredForVisitPartner: true
          stableRefSource: docs/openapi/rf.yaml#/tags/rf/x-go2asia-rf/stableRefPolicy/partnerId
          wireFormat: string
        targetType: partner
  - description: |
      Runtime-implemented RF baseline for downstream consumption. Use this tag contract for integration; treat outline-only endpoints as planned.
    name: rf
    x-go2asia-rf:
      consumerSeam:
        explicitlyOutOfScopeInThisSpec:
          - /v1/rf/branches
          - moderation and verification workflow endpoints beyond current baseline
        normativeHttpPaths:
          - /v1/rf/partners
          - /v1/rf/partners/{partnerId}
          - /v1/rf/offers
          - /v1/rf/offers/{offerId}
          - /v1/rf/rielt/listings/{listingId}/offers
          - /v1/rf/rielt/listings/{listingId}/offers/{offerId}/claim
          - /v1/rf/business/partners
          - /v1/rf/business/partners/{partnerId}/items
          - /v1/rf/business/partners/{partnerId}/items/{itemId}
          - /v1/rf/business/partners/{partnerId}/items/{itemId}/archive
          - /v1/rf/business/partners/{partnerId}/offers
          - /v1/rf/business/partners/{partnerId}/offers/{offerId}/activate
          - /v1/rf/offers/{offerId}/claim
          - /v1/rf/me/vouchers
          - /v1/rf/me/vouchers/summary
          - /v1/rf/business/partners/{partnerId}/vouchers/{voucherId}/redeem
          - /v1/rf/business/partners/{partnerId}/pro-links
          - /v1/rf/pro/attributed-vouchers
          - /v1/rf/pro/links
          - /v1/rf/pro/links/{proLinkId}/accept
          - /v1/rf/pro/links/{proLinkId}/reject
          - /v1/rf/pro/links/{proLinkId}/end
      contractClass: runtime-implemented
      plannedSurfaceDoc: docs/architecture/rf/rf_openapi_outline_v1.md
      stableRefPolicy:
        branchId:
          firstSlicePolicy: |
            Downstream first-slice integrations must not require branchId until branch runtime surface is explicitly added to this OpenAPI contract.
          presentInThisContract: false
        offerId:
          assignedBy: rf-service
          opaque: true
          wireFormat: string
        partnerId:
          assignedBy: rf-service
          opaque: true
          wireFormat: string
        proLinkId:
          assignedBy: rf-service
          opaque: true
          wireFormat: string
        voucherId:
          assignedBy: rf-service
          opaque: true
          wireFormat: string
  - name: reactions
  - name: rielt
  - name: feed
  - description: Space social-core endpoints
    name: space
