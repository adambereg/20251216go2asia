openapi: 3.1.0

info:
  title: Go2Asia Content Service API
  version: 0.1.0
  description: >
    Downstream API contract for Content Service (M2/M4).

    Notes:
    - Public GET endpoints are accessible via API Gateway.
    - Authorized endpoints (event registration) require gateway-origin auth and asserted user context.

servers:
  - url: https://staging.api.go2asia.space
    description: Staging API Gateway (user-facing paths proxied to downstream)
  - url: https://{workerHost}
    description: Direct service URL (workers.dev / local)
    variables:
      workerHost:
        default: content-service.example

tags:
  - name: health
    description: Service health checks
  - name: content
    description: Atlas/Pulse/Blog public read endpoints
  - name: media
    description: Media/Storage (R2) endpoints (Phase 2.2)
  - name: debug
    description: Debug endpoints (no secrets)

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health check
      description: Returns service health status. No auth required.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /version:
    get:
      tags: [health]
      operationId: getVersion
      summary: Version (alias of /health)
      description: Returns service version metadata. Alias of /health. No auth required.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/content/_debug/db:
    get:
      tags: [debug]
      operationId: debugDb
      summary: Debug DB connectivity and counts (no secrets)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebugDbResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/events:
    get:
      tags: [content]
      operationId: listEvents
      summary: List events (public)
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEventsResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/events/{id}:
    get:
      tags: [content]
      operationId: getEventById
      summary: Get event by id (public)
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentEventDto"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/events/{id}/register:
    post:
      tags: [content]
      operationId: registerForEvent
      summary: Register current user for event (authorized)
      description: Requires gateway-origin auth and asserted user context.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/XGatewayAuth"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/EventId"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRegistrationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/media/upload-token:
    post:
      tags: [media]
      operationId: createMediaUploadToken
      summary: Create signed upload token (authorized)
      description: >
        Creates a short-lived signed token for uploading media through the canonical gateway-level media surface.
        Security: token issuance requires gateway-origin auth + asserted user context. Upload uses the signed token.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/XGatewayAuth"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadTokenRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUploadTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/media/upload/{token}:
    put:
      tags: [media]
      operationId: uploadMediaByToken
      summary: Upload media by signed token (no user auth)
      description: >
        Uploads binary content to R2. The request is authorized by the signed token in the URL.
        Recommended Content-Type: image/*
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/media/{mediaId}/attach:
    post:
      tags: [media]
      operationId: attachMediaUsage
      summary: Attach media usage to a domain owner (authorized)
      description: >
        Records a minimal usage binding for an existing media asset and marks it attached.
        Requires gateway-origin auth and media ownership.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/XGatewayAuth"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/MediaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachMediaUsageRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachMediaUsageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/countries:
    get:
      tags: [content]
      operationId: listCountries
      summary: List countries (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCountriesResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/cities:
    get:
      tags: [content]
      operationId: listCities
      summary: List cities (public)
      parameters:
        - $ref: "#/components/parameters/CountryId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCitiesResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/countries/{idOrSlug}/tabs:
    get:
      tags: [content]
      operationId: listCountryTabs
      summary: List country tabs (public)
      parameters:
        - $ref: "#/components/parameters/CountryIdOrSlug"
        - $ref: "#/components/parameters/TabKey"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListContentTabsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/cities/{idOrSlug}/tabs:
    get:
      tags: [content]
      operationId: listCityTabs
      summary: List city tabs (public)
      parameters:
        - $ref: "#/components/parameters/CityIdOrSlug"
        - $ref: "#/components/parameters/TabKey"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListContentTabsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/cities/{idOrSlug}/districts:
    get:
      tags: [content]
      operationId: listCityDistricts
      summary: List city districts (public)
      parameters:
        - $ref: "#/components/parameters/CityIdOrSlug"
        - $ref: "#/components/parameters/IncludeUnpublished"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCityDistrictsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/cities/{idOrSlug}/containers:
    get:
      tags: [content]
      operationId: listCityPlaceContainers
      summary: List city place containers (public)
      parameters:
        - $ref: "#/components/parameters/CityIdOrSlug"
        - $ref: "#/components/parameters/DistrictIdOrSlug"
        - $ref: "#/components/parameters/IncludeUnpublished"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPlaceContainersResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/places:
    get:
      tags: [content]
      operationId: listPlaces
      summary: List places (public)
      parameters:
        - $ref: "#/components/parameters/CityId"
        - $ref: "#/components/parameters/CountryId"
        - $ref: "#/components/parameters/DistrictIdOrSlug"
        - $ref: "#/components/parameters/PlaceKind"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPlacesResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/places/{idOrSlug}:
    get:
      tags: [content]
      operationId: getPlaceByIdOrSlug
      summary: Get place by id or slug (public)
      parameters:
        - $ref: "#/components/parameters/PlaceIdOrSlug"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPlaceDto"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/articles:
    get:
      tags: [content]
      operationId: listArticles
      summary: List articles (public)
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListArticlesResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/articles/{slug}:
    get:
      tags: [content]
      operationId: getArticleBySlug
      summary: Get article by slug (public)
      parameters:
        - $ref: "#/components/parameters/ArticleSlug"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentArticleDto"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/blog/posts:
    get:
      tags: [content]
      operationId: listBlogPosts
      summary: List blog posts (public)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque pagination cursor (base64url)
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, popular, featured]
            default: newest
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Full-text-ish search over title/excerpt/content
        - name: tag
          in: query
          required: false
          schema:
            type: string
          description: Filter by tag slug
        - name: author
          in: query
          required: false
          schema:
            type: string
          description: Filter by author slug
        - name: exclude_slug
          in: query
          required: false
          schema:
            type: string
          description: Exclude one post (for related lists)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorListBlogPostsResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/content/blog/posts/{slug}:
    get:
      tags: [content]
      operationId: getBlogPostBySlug
      summary: Get blog post by slug (public)
      parameters:
        - $ref: "#/components/parameters/ArticleSlug"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentBlogPostDetailDto"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    GatewayAuth:
      type: apiKey
      in: header
      name: X-Gateway-Auth
      description: Service JWT issued/forwarded by API Gateway to authenticate gateway-origin requests

  parameters:
    XGatewayAuth:
      name: X-Gateway-Auth
      in: header
      required: true
      schema:
        type: string
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
    EventId:
      name: id
      in: path
      required: true
      schema:
        type: string
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
    CountryId:
      name: countryId
      in: query
      required: false
      schema:
        type: string
    CityId:
      name: cityId
      in: query
      required: false
      schema:
        type: string
    PlaceKind:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum: [showplace, business]
    PlaceIdOrSlug:
      name: idOrSlug
      in: path
      required: true
      schema:
        type: string
    CountryIdOrSlug:
      name: idOrSlug
      in: path
      required: true
      schema:
        type: string
    CityIdOrSlug:
      name: idOrSlug
      in: path
      required: true
      schema:
        type: string
    ArticleSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    TabKey:
      name: tabKey
      in: query
      required: false
      schema:
        type: string
    Lang:
      name: lang
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    DistrictIdOrSlug:
      name: district
      in: query
      required: false
      schema:
        type: string
    IncludeUnpublished:
      name: includeUnpublished
      in: query
      required: false
      schema:
        type: boolean

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceAuthNotConfigured:
      description: Service auth is not configured (missing secret/env)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [service, env, status, version]
      properties:
        service:
          type: string
          example: content-service
        env:
          type: string
          example: staging
        status:
          type: string
          example: ok
        version:
          type: string
          example: "<sha>"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "UNAUTHORIZED"
            message:
              type: string
              example: "Invalid X-Gateway-Auth token"
        requestId:
          type: string

    DebugDbResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: object
          nullable: true
          additionalProperties: true
        counts:
          type: object
          nullable: true
          additionalProperties:
            type: integer

    ListEventsResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentEventDto"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    ListCountriesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentCountryDto"

    ListCitiesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentCityDto"

    ListPlacesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentPlaceDto"

    ListCityDistrictsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentCityDistrictDto"

    ListPlaceContainersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentPlaceContainerDto"

    ListArticlesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentArticleDto"

    CursorListBlogPostsResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentBlogPostCardDto"
        nextCursor:
          type: string
          nullable: true

    ContentBlogAuthorDto:
      type: object
      required: [slug, displayName, avatarUrl]
      properties:
        slug:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true

    ContentBlogPostCardDto:
      type: object
      required:
        [
          id,
          slug,
          lang,
          title,
          subtitle,
          excerpt,
          postType,
          category,
          tags,
          heroUrl,
          publishedAt,
          updatedAt,
          readingTimeMinutes,
          isPromoted,
          isFeatured,
          isEditorPick,
          author,
        ]
      properties:
        id:
          type: string
        slug:
          type: string
        lang:
          type: string
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        excerpt:
          type: string
          nullable: true
        postType:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        heroUrl:
          type: string
          nullable: true
        publishedAt:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
        readingTimeMinutes:
          type: integer
          nullable: true
        isPromoted:
          type: boolean
        isFeatured:
          type: boolean
        isEditorPick:
          type: boolean
        author:
          $ref: "#/components/schemas/ContentBlogAuthorDto"
          nullable: true

    ContentBlogPostDetailDto:
      allOf:
        - $ref: "#/components/schemas/ContentBlogPostCardDto"
        - type: object
          required: [contentMarkdown]
          properties:
            contentMarkdown:
              type: string

    ListContentTabsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentTabDto"

    EventRegistrationResponse:
      type: object
      required: [ok, registrationId, eventId, userId]
      properties:
        ok:
          type: boolean
        registrationId:
          type: string
        eventId:
          type: string
        userId:
          type: string

    MediaScope:
      type: string
      description: Logical scope for object key prefixing (Phase 2).
      enum: [content, space, rf, rielt, quest, avatar]

    ContentTabDto:
      type: object
      required: [tabKey, lang, bodyMarkdown]
      properties:
        tabKey:
          type: string
        lang:
          type: string
        title:
          type: string
          nullable: true
        bodyMarkdown:
          type: string
        updatedAt:
          type: string
          nullable: true

    CreateUploadTokenRequest:
      type: object
      required: [scope, filename, contentType]
      properties:
        scope:
          $ref: "#/components/schemas/MediaScope"
        filename:
          type: string
        contentType:
          type: string
          description: Only image/* is allowed in Phase 2.2 baseline
        sizeBytes:
          type: integer
          nullable: true
          description: Optional client hint for size validation

    CreateUploadTokenResponse:
      type: object
      required: [uploadUrl, key, expiresAt]
      properties:
        uploadUrl:
          type: string
          description: Relative URL to the canonical media upload endpoint (via API Gateway)
        key:
          type: string
          description: R2 object key
        publicUrl:
          type: string
          nullable: true
          description: Public URL if MEDIA_PUBLIC_BASE_URL is configured
        expiresAt:
          type: string
          format: date-time
        requestId:
          type: string
          nullable: true

    UploadResult:
      type: object
      required: [ok, key]
      properties:
        ok:
          type: boolean
        key:
          type: string
        publicUrl:
          type: string
          nullable: true
        requestId:
          type: string
          nullable: true

    AttachMediaUsageRequest:
      type: object
      required: [ownerType, ownerId, usageType]
      properties:
        ownerType:
          type: string
          enum: [user, space_post, rielt_listing, rf_partner, quest_submission, blog_post, atlas_entity]
        ownerId:
          type: string
        usageType:
          type: string
          description: Slot semantic, e.g. hero_image, gallery_item, cover
        slot:
          type: string
          nullable: true

    AttachMediaUsageResponse:
      type: object
      required: [ok, media_id, status, usage, requestId]
      properties:
        ok:
          type: boolean
        media_id:
          type: string
        status:
          type: string
          enum: [attached]
        usage:
          type: object
          required: [ownerType, ownerId, usageType]
          properties:
            ownerType:
              type: string
            ownerId:
              type: string
            usageType:
              type: string
            slot:
              type: string
              nullable: true
        requestId:
          type: string

    ContentEventDto:
      type: object
      required:
        [
          id,
          title,
          slug,
          shortDescription,
          bodyMarkdown,
          category,
          startDate,
          endDate,
          location,
          latitude,
          longitude,
          countrySlug,
          citySlug,
          countryName,
          cityName,
          year,
          heroMediaKey,
          galleryMediaKeys,
          isActive,
          isFree,
          priceAmount,
          priceCurrency,
          isVerified,
          officialUrl,
          seoTitle,
          seoDescription,
        ]
      properties:
        id:
          type: string
