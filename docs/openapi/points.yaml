openapi: 3.1.0

info:
  title: Go2Asia Points Service API
  version: 0.1.0
  description: >
    Downstream API contract for Points Service (Milestone 3).

    Notes:
    - User-facing endpoints are called via API Gateway.
    - Downstream does NOT validate user JWT in M3; it accepts user-context only when the request is authenticated as gateway-origin.

servers:
  - url: https://staging.api.go2asia.space
    description: Staging API Gateway (user-facing paths proxied to downstream)
  - url: https://{workerHost}
    description: Direct service URL (workers.dev / local)
    variables:
      workerHost:
        default: points-service.example

tags:
  - name: health
    description: Service health checks
  - name: points
    description: Points balance and ledger operations
  - name: wallet
    description: Economy wallet buckets and status summary
  - name: badges
    description: Off-chain badge catalog and user badge awards
  - name: internal
    description: Service-to-service APIs (authenticated)

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health check
      description: Returns service health status. No auth required.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /version:
    get:
      tags: [health]
      operationId: getVersion
      summary: Version (alias of /health)
      description: Returns service version metadata. Alias of /health. No auth required.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/points/balance:
    get:
      tags: [points]
      operationId: getPointsBalance
      summary: Get current user points balance
      description: User-facing read endpoint (called via gateway). Requires gateway-origin auth and asserted user context.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/XGatewayAuth"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBalance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/wallet/summary:
    get:
      tags: [wallet]
      operationId: getWalletSummary
      summary: Get current user wallet summary
      description: >
        User-facing read endpoint (called via gateway). Returns ledger-based Points bucket projections for the
        current user without changing the underlying `user_balances.balance` storage model.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/XGatewayAuth"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/points/connect-dashboard:
    get:
      tags: [points]
      operationId: getConnectDashboard
      summary: Get current user Connect dashboard read model
      description: >
        User-facing read endpoint (called via gateway). Returns a bounded convenience dashboard surface composed from real backend facts only.
        Important:
        - This endpoint is read-only and does not become source of truth.
        - Balance remains sourced from `user_balances`.
        - Transactions remain sourced from `points_transactions`.
        - Badge data remains sourced from `badges` and `user_badges`.
        - Referral summary is a lightweight convenience composition and does not move referral ownership into Points Service.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/XGatewayAuth"
        - $ref: "#/components/parameters/XRequestId"
        - name: transactionsLimit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
        - name: badgesLimit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectDashboardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/points/transactions:
    get:
      tags: [points]
      operationId: listPointsTransactions
      summary: List current user points transactions
      description: User-facing read endpoint (called via gateway). Returns a paginated list of ledger transactions for the current user.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/XGatewayAuth"
        - $ref: "#/components/parameters/XRequestId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/points/badges:
    get:
      tags: [badges]
      operationId: listActiveBadges
      summary: List active badge catalog entries
      description: User-facing read endpoint (called via gateway). Returns active off-chain badge definitions only.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/XGatewayAuth"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/points/badges/mine:
    get:
      tags: [badges]
      operationId: listMyBadges
      summary: List current user badge awards
      description: User-facing read endpoint (called via gateway). Returns badge awards for the authenticated user only.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/XGatewayAuth"
        - $ref: "#/components/parameters/XRequestId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBadgesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/points/add:
    post:
      tags: [internal]
      operationId: addPoints
      summary: Add points to a user (idempotent)
      description: >
        Idempotency policy (M3):
        - `externalId` is required and MUST be globally unique for Points Service.
        - If `externalId` already exists and the incoming ledger write does not match the previously accepted write => 409 Conflict and the event MUST be logged as an integration error.
        - `sourceService` is derived from the authenticated service JWT subject, not supplied by the caller.
        - `sourceEventId` is an optional caller-supplied audit pointer to the originating domain event or record.

        Limits policy (M3):
        - Per-action limits and a simple configurable per-user velocity cap are applied inside Points Service.
      security:
        - ServiceAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPointsRequest"
      responses:
        "200":
          description: OK (applied or duplicate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddPointsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/points/spend:
    post:
      tags: [internal]
      operationId: spendPoints
      summary: Spend points from user available balance (idempotent)
      description: >
        Internal spend endpoint for service-to-service usage.
        Idempotency policy:
        - `externalId` is required and MUST be globally unique for Points Service.
        - Replaying the same `externalId` with the same payload returns `applied=false` and `idempotentReplay=true`.
        - Reusing `externalId` with a different payload returns 409 with deterministic `REPLAY_PAYLOAD_MISMATCH`.

        Balance policy:
        - `amount` in request is positive spend quantity (`>=1`).
        - Ledger stores spend as negative amount.
        - Spend is applied only from available `user_balances.balance`.
        - If balance is insufficient, endpoint returns 409 `INSUFFICIENT_POINTS_BALANCE` and does not mutate ledger/balance.
      security:
        - ServiceAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpendPointsRequest"
      responses:
        "200":
          description: OK (applied or idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendPointsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/points/support-lookup:
    post:
      tags: [internal]
      operationId: lookupPointsSupportReference
      summary: Resolve a bounded support lookup key to an owner fact reference
      description: >
        Internal support-safe navigation endpoint. It resolves bounded projection lookup keys to owner fact references
        without terminating proof, closing support cases, or exposing admin diagnostics.
      security:
        - ServiceAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportLookupRequest"
      responses:
        "200":
          description: Lookup completed. The status describes whether navigation is available, not proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportLookupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/points/admin-diagnostics:
    post:
      tags: [internal]
      operationId: getPointsAdminDiagnosticSnapshot
      summary: Create a bounded internal Points admin diagnostic snapshot
      description: >
        Internal admin/support diagnostic endpoint. It consumes a bounded support lookup key and returns
        operator navigation pointers without terminating proof, closing support outcomes, exposing a customer URL,
        or creating accounting authority.
      security:
        - ServiceAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDiagnosticRequest"
      responses:
        "200":
          description: Diagnostic snapshot created for internal navigation only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDiagnosticSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/points/badges/award:
    post:
      tags: [internal]
      operationId: awardBadge
      summary: Award an off-chain badge to a user (idempotent)
      description: >
        Service-to-service badge award endpoint.
        Important:
        - Badge awards are off-chain achievements only.
        - Awarding a badge MUST NOT create a points transaction or mutate a points balance.
        - `badgeCode`, `sourceType`, and `sourceId` are required to support auditability and idempotent award semantics.
        - Repeating the same award returns `applied=false`; attempting to reuse the same badge for the same user with a different source returns 409 Conflict.
      security:
        - ServiceAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwardBadgeRequest"
      responses:
        "200":
          description: OK (applied or duplicate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwardBadgeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceAuthNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    GatewayAuth:
      type: apiKey
      in: header
      name: X-Gateway-Auth
      description: >
        Service JWT issued/forwarded by API Gateway to authenticate gateway-origin requests (M3).
    ServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service JWT (M3)

  parameters:
    XGatewayAuth:
      name: X-Gateway-Auth
      in: header
      required: true
      schema:
        type: string
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: Correlation id

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceAuthNotConfigured:
      description: Service auth is not configured (missing secret/env)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [service, env, status, version]
      properties:
        service:
          type: string
          example: points-service
        env:
          type: string
          example: staging
        status:
          type: string
          example: ok
        version:
          type: string
          example: "<sha>"

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: "UNAUTHORIZED"
        message:
          type: string
          example: "Invalid Authorization token"
        requestId:
          type: string

    ProjectionSource:
      type: string
      enum:
        - POINTS_SERVICE

    ProjectionKind:
      type: string
      enum:
        - ACTIVITY_PROJECTION
        - POINTS_SUMMARY
        - BADGE_PREVIEW
        - RF_LIFECYCLE_PROJECTION
        - INQUIRY_PROJECTION

    ProjectionReferenceScope:
      type: string
      enum:
        - READ_ONLY
        - REFERENCE_ONLY
        - PREVIEW_ONLY
        - INQUIRY_ONLY

    ProjectionOwnerFactReference:
      type: object
      required: [ownerService, ownerEntity, referenceType]
      properties:
        ownerService:
          type: string
          description: Service that owns the source record. This is a lookup hint, not proof.
        ownerEntity:
          type: string
          description: Owner table or entity family that can be re-resolved by support/admin tooling.
        referenceType:
          type: string
          enum:
            - OWNER_FACT_REFERENCE

    ProjectionMetadataEnvelope:
      type: object
      required: [projectionSource, projectionKind, generatedAt, referenceScope]
      description: >
        Runtime metadata for read-only projection surfaces. This envelope is additive, non-authoritative,
        and cannot terminate proof or replace owner-service lookup.
      properties:
        projectionSource:
          $ref: "#/components/schemas/ProjectionSource"
        projectionKind:
          $ref: "#/components/schemas/ProjectionKind"
        generatedAt:
          type: string
          format: date-time
          description: Time the projection response metadata was composed.
        referenceScope:
          $ref: "#/components/schemas/ProjectionReferenceScope"
        ownerFactReference:
          $ref: "#/components/schemas/ProjectionOwnerFactReference"
        supportLookupKey:
          type: string
          description: Optional bounded support navigation key. It is not customer proof or support resolution.

    SupportLookupScope:
      type: string
      enum:
        - SUPPORT_SAFE

    SupportLookupVisibility:
      type: string
      enum:
        - INTERNAL_REFERENCE

    SupportLookupStatus:
      type: string
      enum:
        - LOOKUP_AVAILABLE
        - LOOKUP_LIMITED
        - LOOKUP_UNAVAILABLE

    SupportLookupRequest:
      type: object
      required: [supportLookupKey]
      properties:
        supportLookupKey:
          type: string
          description: Opaque bounded key emitted by projection metadata. It is navigation-only, not proof.

    SupportLookupOwnerFactReference:
      type: object
      required: [ownerService, ownerEntity, ownerLookupId, referenceType]
      description: >
        Internal owner fact navigation pointer. This is not case resolution, accounting statement or proof terminator.
      properties:
        ownerService:
          type: string
          enum:
            - points-service
        ownerEntity:
          type: string
          enum:
            - user_balances
            - points_transactions
        ownerLookupId:
          type: string
          description: Opaque owner lookup identifier for support tooling.
        referenceType:
          type: string
          enum:
            - OWNER_FACT_REFERENCE
        ownerTimestamp:
          type: string
          format: date-time
          description: Owner row timestamp when safely available. It is not proof finality.

    SupportLookupResponse:
      type: object
      required: [supportLookupKey, lookupScope, lookupVisibility, lookupStatus, lookupNote]
      properties:
        supportLookupKey:
          type: string
        lookupScope:
          $ref: "#/components/schemas/SupportLookupScope"
        lookupVisibility:
          $ref: "#/components/schemas/SupportLookupVisibility"
        lookupStatus:
          $ref: "#/components/schemas/SupportLookupStatus"
        ownerFactReference:
          $ref: "#/components/schemas/SupportLookupOwnerFactReference"
        lookupNote:
          type: string
          description: Human-readable internal note. This must not be treated as support resolution.

    DiagnosticVisibility:
      type: string
      enum:
        - ADMIN_DIAGNOSTIC
        - INTERNAL_DIAGNOSTIC

    DiagnosticKind:
      type: string
      enum:
        - POINTS_OWNER_FACT_LOOKUP
        - POINTS_PROJECTION_TRACE
        - SUPPORT_LOOKUP_DIAGNOSTIC

    AdminDiagnosticOperatorBoundary:
      type: string
      enum:
        - INTERNAL_NAVIGATION_ONLY

    AdminDiagnosticRequest:
      type: object
      required: [supportLookupKey]
      properties:
        supportLookupKey:
          type: string
          description: Opaque bounded key emitted by projection metadata. It is used for internal diagnostics navigation only.
        diagnosticKind:
          $ref: "#/components/schemas/DiagnosticKind"

    AdminDiagnosticLookupInput:
      type: object
      required: [supportLookupKey]
      properties:
        supportLookupKey:
          type: string

    OwnerFactPointer:
      type: object
      required: [ownerService, ownerEntity, ownerLookupId, pointerType, lookupStatus]
      description: Internal navigation pointer to an owner fact or owner fact family. The owner service remains authoritative.
      properties:
        ownerService:
          type: string
          enum:
            - points-service
        ownerEntity:
          type: string
          enum:
            - user_balances
            - points_transactions
        ownerLookupId:
          type: string
          description: Bounded owner lookup identifier for internal tooling.
        pointerType:
          type: string
          enum:
            - OWNER_FACT_POINTER
        lookupStatus:
          $ref: "#/components/schemas/SupportLookupStatus"
        ownerTimestamp:
          type: string
          format: date-time
          description: Owner row timestamp when safely available. It is not final authority by itself.

    AdminDiagnosticSnapshot:
      type: object
      required:
        - diagnosticId
        - diagnosticKind
        - diagnosticVisibility
        - generatedAt
        - lookupInput
        - lookupStatus
        - ownerFactPointers
        - notes
        - operatorBoundary
        - isCustomerProof
        - canTerminateProof
      description: Internal diagnostic snapshot for bounded operator navigation. It is not customer proof or support outcome.
      properties:
        diagnosticId:
          type: string
        diagnosticKind:
          $ref: "#/components/schemas/DiagnosticKind"
        diagnosticVisibility:
          $ref: "#/components/schemas/DiagnosticVisibility"
        generatedAt:
          type: string
          format: date-time
        lookupInput:
          $ref: "#/components/schemas/AdminDiagnosticLookupInput"
        lookupStatus:
          $ref: "#/components/schemas/SupportLookupStatus"
        ownerFactPointers:
          type: array
          items:
            $ref: "#/components/schemas/OwnerFactPointer"
        notes:
          type: array
          items:
            type: string
        operatorBoundary:
          $ref: "#/components/schemas/AdminDiagnosticOperatorBoundary"
        isCustomerProof:
          type: boolean
          enum: [false]
        canTerminateProof:
          type: boolean
          enum: [false]

    PointsAction:
      type: string
      description: >
        Phase 2 action contract (Points-only). This enum may be extended in Phase 2 **only** by explicit decision.
        IMPORTANT: Phase 3 tokenomics (G2A/NFT/on-chain) actions are intentionally excluded.
      enum:
        - registration
        - first_login
        - referral_bonus_referee
        - referral_bonus_referrer
        - referral_locked
        - referral_unlock
        - event_registration
        - space_post_created
        - space_repost_created
        - space_reaction_created
        - network_accrual_level_1
        - network_accrual_level_2
        - quest_completed
        - rielt_listing_created
        - rf_partner_verified
        - rf_voucher_claimed
        - rf_voucher_redeemed
        - rf_voucher_claim_spend
        - rf_voucher_claim_spend_compensation

    PointsTransaction:
      type: object
      required: [id, userId, amount, action, externalId, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        amount:
          type: integer
          description: Signed points delta
        action:
          $ref: "#/components/schemas/PointsAction"
        sourceService:
          type: string
          nullable: true
          description: Authenticated internal caller that produced the ledger write.
        sourceEventId:
          type: string
          nullable: true
          description: Optional audit pointer to the originating domain event or record.
        externalId:
          type: string
        createdAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    UserBalance:
      type: object
      required: [userId, balance, updatedAt]
      properties:
        userId:
          type: string
        balance:
          type: integer
        updatedAt:
          type: string
          format: date-time
        projectionMetadata:
          $ref: "#/components/schemas/ProjectionMetadataEnvelope"

    WalletStatus:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean

    WalletSummaryResponse:
      type: object
      required:
        - availablePoints
        - lockedPoints
        - networkPoints
        - totalPoints
        - estimatedUnlockablePoints
        - vipStatus
        - proStatus
      properties:
        availablePoints:
          type: integer
          description: Ledger-projected spendable Points bucket.
        lockedPoints:
          type: integer
          description: Ledger-projected locked Points bucket.
        networkPoints:
          type: integer
          description: Ledger-projected network-generated Points bucket.
        totalPoints:
          type: integer
          description: Sum of availablePoints, lockedPoints and networkPoints.
        estimatedUnlockablePoints:
          type: integer
          description: Slice 1 estimate; currently equals lockedPoints.
        vipStatus:
          $ref: "#/components/schemas/WalletStatus"
        proStatus:
          $ref: "#/components/schemas/WalletStatus"
        projectionMetadata:
          $ref: "#/components/schemas/ProjectionMetadataEnvelope"

    ConnectDashboardBalance:
      type: object
      required: [points, updatedAt]
      properties:
