openapi: 3.1.0

info:
  title: Go2Asia RF Service API
  version: 0.1.0
  description: >
    Downstream API contract for RF runtime baseline (Step 11).
    Covers implemented partner/offer/voucher/pro-link practical surfaces only.
    Planned/extended RF API surface is tracked in docs/architecture/rf/rf_openapi_outline_v1.md
    and is not implied as implemented by this file.
    Note: root health paths (/health, /version, /ready) are intentionally excluded from
    docs/openapi/openapi.bundle.yaml by bundle rules (only /v1/* and /internal/*).

servers:
  - url: https://staging.api.go2asia.space
    description: Staging API Gateway
  - url: https://{workerHost}
    description: Direct service URL (workers.dev / local)
    variables:
      workerHost:
        default: rf-service.example

tags:
  - name: health
  - name: rf
    description: >
      Runtime-implemented RF baseline for downstream consumption.
      Use this tag contract for integration; treat outline-only endpoints as planned.
    x-go2asia-rf:
      contractClass: runtime-implemented
      plannedSurfaceDoc: docs/architecture/rf/rf_openapi_outline_v1.md
      stableRefPolicy:
        partnerId:
          wireFormat: string
          opaque: true
          assignedBy: rf-service
        offerId:
          wireFormat: string
          opaque: true
          assignedBy: rf-service
        voucherId:
          wireFormat: string
          opaque: true
          assignedBy: rf-service
        proLinkId:
          wireFormat: string
          opaque: true
          assignedBy: rf-service
        branchId:
          presentInThisContract: false
          firstSlicePolicy: >
            Downstream first-slice integrations must not require branchId until
            branch runtime surface is explicitly added to this OpenAPI contract.
      consumerSeam:
        normativeHttpPaths:
          - /v1/rf/partners
          - /v1/rf/partners/{partnerId}
          - /v1/rf/offers
          - /v1/rf/offers/{offerId}
          - /v1/rf/rielt/listings/{listingId}/offers
          - /v1/rf/rielt/listings/{listingId}/offers/{offerId}/claim
          - /v1/rf/business/partners
          - /v1/rf/business/partners/{partnerId}/items
          - /v1/rf/business/partners/{partnerId}/items/{itemId}
          - /v1/rf/business/partners/{partnerId}/items/{itemId}/archive
          - /v1/rf/business/partners/{partnerId}/offers
          - /v1/rf/business/partners/{partnerId}/offers/{offerId}/activate
          - /v1/rf/offers/{offerId}/claim
          - /v1/rf/me/vouchers
          - /v1/rf/me/vouchers/summary
          - /v1/rf/business/partners/{partnerId}/vouchers/{voucherId}/redeem
          - /v1/rf/business/partners/{partnerId}/pro-links
          - /v1/rf/pro/attributed-vouchers
          - /v1/rf/pro/links
          - /v1/rf/pro/links/{proLinkId}/accept
          - /v1/rf/pro/links/{proLinkId}/reject
          - /v1/rf/pro/links/{proLinkId}/end
        explicitlyOutOfScopeInThisSpec:
          - /v1/rf/branches
          - moderation and verification workflow endpoints beyond current baseline

paths:
  /health:
    get:
      tags: [health]
      operationId: getRfHealth
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfHealthResponse"

  /version:
    get:
      tags: [health]
      operationId: getRfVersion
      summary: Version (alias of /health)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfHealthResponse"

  /ready:
    get:
      tags: [health]
      operationId: getRfReady
      summary: Readiness check
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfReadyResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfReadyResponse"

  /v1/rf/partners:
    get:
      tags: [rf]
      operationId: rfListPartners
      summary: List public partners
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfPartnerListResponse"

  /v1/rf/business/partners:
    post:
      tags: [rf]
      operationId: rfCreatePartner
      summary: Create partner (business owner flow)
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfCreatePartnerRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfPartner"
        "400":
          $ref: "#/components/responses/RfValidationError"
        "401":
          $ref: "#/components/responses/RfUnauthorized"

  /v1/rf/business/partners/{partnerId}/items:
    get:
      tags: [rf]
      operationId: rfListPartnerItems
      summary: List product/service items for an owned partner
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - $ref: "#/components/parameters/RfPartnerId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfPartnerItemListResponse"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "403":
          $ref: "#/components/responses/RfForbidden"
        "404":
          $ref: "#/components/responses/RfNotFound"
    post:
      tags: [rf]
      operationId: rfCreatePartnerItem
      summary: Create product/service item for an owned partner
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - $ref: "#/components/parameters/RfPartnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfCreatePartnerItemRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfPartnerItem"
        "400":
          $ref: "#/components/responses/RfValidationError"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "403":
          $ref: "#/components/responses/RfForbidden"
        "404":
          $ref: "#/components/responses/RfNotFound"

  /v1/rf/business/partners/{partnerId}/items/{itemId}:
    patch:
      tags: [rf]
      operationId: rfUpdatePartnerItem
      summary: Update product/service item for an owned partner
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - $ref: "#/components/parameters/RfPartnerId"
        - $ref: "#/components/parameters/RfPartnerItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfUpdatePartnerItemRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfPartnerItem"
        "400":
          $ref: "#/components/responses/RfValidationError"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "403":
          $ref: "#/components/responses/RfForbidden"
        "404":
          $ref: "#/components/responses/RfNotFound"

  /v1/rf/business/partners/{partnerId}/items/{itemId}/archive:
    post:
      tags: [rf]
      operationId: rfArchivePartnerItem
      summary: Archive product/service item for an owned partner
      description: >
        Soft-archives an item. Existing offers keep their optional itemId reference;
        claim/redeem and voucher uniqueness remain offer-level.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - $ref: "#/components/parameters/RfPartnerId"
        - $ref: "#/components/parameters/RfPartnerItemId"
      responses:
        "200":
          description: Archived or already archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfPartnerItem"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "403":
          $ref: "#/components/responses/RfForbidden"
        "404":
          $ref: "#/components/responses/RfNotFound"

  /v1/rf/partners/{partnerId}:
    get:
      tags: [rf]
      operationId: rfGetPartner
      summary: Get public partner
      parameters:
        - $ref: "#/components/parameters/RfPartnerId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfPartner"
        "404":
          $ref: "#/components/responses/RfNotFound"

  /v1/rf/offers:
    get:
      tags: [rf]
      operationId: rfListOffers
      summary: List public active offers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfOfferListResponse"

  /v1/rf/offers/{offerId}:
    get:
      tags: [rf]
      operationId: rfGetOffer
      summary: Get public offer
      parameters:
        - $ref: "#/components/parameters/RfOfferId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfOffer"
        "404":
          $ref: "#/components/responses/RfNotFound"

  /v1/rf/rielt/listings/{listingId}/offers:
    get:
      tags: [rf]
      operationId: rfGetRieltListingOffers
      summary: Get RF offers mapped to a Rielt listing
      description: >
        Read-only RF-owned listing voucher context. Returns public active RF offers explicitly
        mapped to the Rielt listing. Does not claim or redeem vouchers.
      parameters:
        - $ref: "#/components/parameters/RfRieltListingId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfRieltListingOfferContext"
        "404":
          $ref: "#/components/responses/RfNotFound"

  /v1/rf/rielt/listings/{listingId}/offers/{offerId}/claim:
    post:
      tags: [rf]
      operationId: rfClaimRieltListingVoucher
      summary: Claim listing-scoped voucher for mapped Rielt offer
      description: >
        Claims a voucher in RF for a specific Rielt listing context. RF validates that
        the offer is actively mapped to the listing, the offer is public and active,
        and the partner is active. This endpoint does not replace the partner-scope
        claim endpoint.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - $ref: "#/components/parameters/RfRieltListingId"
        - $ref: "#/components/parameters/RfOfferId"
        - $ref: "#/components/parameters/RfIdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfClaimVoucherRequest"
      responses:
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfClaimResponse"
        "201":
          description: Listing-scoped voucher created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfClaimResponse"
        "400":
          $ref: "#/components/responses/RfValidationError"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "404":
          $ref: "#/components/responses/RfNotFound"
        "409":
          description: >
            Conflict, including RF_IDEMPOTENCY_KEY_CONTEXT_MISMATCH.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfErrorResponse"
        "429":
          $ref: "#/components/responses/RfRateLimited"
        "500":
          $ref: "#/components/responses/RfInternalError"
        "503":
          $ref: "#/components/responses/RfServiceUnavailable"

  /v1/rf/business/partners/{partnerId}/offers:
    post:
      tags: [rf]
      operationId: rfCreateOffer
      summary: Create draft offer for partner
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - $ref: "#/components/parameters/RfPartnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfCreateOfferRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfOffer"
        "400":
          $ref: "#/components/responses/RfValidationError"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "403":
          $ref: "#/components/responses/RfForbidden"
        "404":
          $ref: "#/components/responses/RfNotFound"

  /v1/rf/business/partners/{partnerId}/offers/{offerId}/activate:
    post:
      tags: [rf]
      operationId: rfActivateOffer
      summary: Activate partner offer
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - $ref: "#/components/parameters/RfPartnerId"
        - $ref: "#/components/parameters/RfOfferId"
      responses:
        "200":
          description: Activated or already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfOffer"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "403":
          $ref: "#/components/responses/RfForbidden"
        "404":
          $ref: "#/components/responses/RfNotFound"
        "409":
          $ref: "#/components/responses/RfConflict"

  /v1/rf/offers/{offerId}/claim:
    post:
      tags: [rf]
      operationId: rfClaimVoucher
      summary: Claim voucher for active offer (idempotent by user+key)
      description: >
        Claim is allowed only for active public offers of active RF partners.
        Runtime status uses `claimed`; in product semantics this corresponds to an issued voucher.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - $ref: "#/components/parameters/RfOfferId"
        - $ref: "#/components/parameters/RfIdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfClaimVoucherRequest"
      responses:
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfClaimResponse"
        "201":
          description: Voucher created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfClaimResponse"
        "400":
          $ref: "#/components/responses/RfValidationError"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "404":
          $ref: "#/components/responses/RfNotFound"
        "409":
          $ref: "#/components/responses/RfConflict"
        "429":
          $ref: "#/components/responses/RfRateLimited"
        "500":
          $ref: "#/components/responses/RfInternalError"
        "503":
          $ref: "#/components/responses/RfServiceUnavailable"

  /v1/rf/me/vouchers:
    get:
      tags: [rf]
      operationId: rfListMyVouchers
      summary: List current user vouchers
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfVoucherListResponse"
        "401":
          $ref: "#/components/responses/RfUnauthorized"

  /v1/rf/me/vouchers/summary:
    get:
      tags: [rf]
      operationId: rfGetMyVoucherSummary
      summary: Get current user voucher summary
      description: >
        Read-only RF-owned voucher summary for the authenticated user. Counts are based on
        RF runtime statuses; `claimed` is the active/issued product-semantic bucket.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfVoucherSummary"
        "401":
          $ref: "#/components/responses/RfUnauthorized"

  /v1/rf/internal/vouchers/{voucherId}/diagnostics:
    get:
      tags: [rf]
      operationId: rfGetInternalVoucherDiagnostics
      summary: Internal RF voucher diagnostics (admin-only, read-only)
      description: >
        Internal/admin diagnostics endpoint for support and QA.
        Returns read-only voucher lifecycle, redemption, repeatability, attribution and idempotency state.
        Not for public, PRO or merchant product UI.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - $ref: "#/components/parameters/RfVoucherId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfInternalVoucherDiagnosticsResponse"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "403":
          $ref: "#/components/responses/RfForbidden"
        "404":
          $ref: "#/components/responses/RfNotFound"

  /v1/rf/business/partners/{partnerId}/vouchers/{voucherId}/redeem:
    post:
      tags: [rf]
      operationId: rfRedeemVoucher
      summary: Redeem voucher by partner owner
      description: >
        Redeem is an owner-authorized partner-side flow. The authenticated actor must own
        the partner in path, and voucher relation (voucher.partnerId, voucher.offerId, offer.partnerId)
        must be consistent.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - $ref: "#/components/parameters/RfPartnerId"
        - $ref: "#/components/parameters/RfVoucherId"
        - $ref: "#/components/parameters/RfOptionalIdempotencyKey"
      responses:
        "200":
          description: Redeem processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfRedeemResponse"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "403":
          $ref: "#/components/responses/RfForbidden"
        "404":
          $ref: "#/components/responses/RfNotFound"
        "409":
          $ref: "#/components/responses/RfConflict"
        "429":
          $ref: "#/components/responses/RfRateLimited"
        "503":
          $ref: "#/components/responses/RfServiceUnavailable"

  /v1/rf/business/partners/{partnerId}/pro-links:
    get:
      tags: [rf]
      operationId: rfListPartnerProLinks
      summary: List PRO links for an owned partner
      description: >
        Owner-scoped read endpoint for incoming and historical PRO links on a partner.
        The authenticated actor must own the partner in path. The endpoint is read-only
        and does not accept, reject, reward or attribute claims/redeems.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - $ref: "#/components/parameters/RfPartnerId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfProLinkListResponse"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "403":
          $ref: "#/components/responses/RfForbidden"
        "404":
          $ref: "#/components/responses/RfNotFound"

  /v1/rf/pro/links:
    get:
      tags: [rf]
      operationId: rfListProLinks
      summary: List current user PRO links
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfProLinkListResponse"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
    post:
      tags: [rf]
      operationId: rfCreateProLink
      summary: Create PRO link
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfCreateProLinkRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfProLink"
        "400":
          $ref: "#/components/responses/RfValidationError"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "404":
          $ref: "#/components/responses/RfNotFound"

  /v1/rf/pro/attributed-vouchers:
    get:
      tags: [rf]
      operationId: rfListProAttributedVouchers
      summary: List current PRO attributed vouchers
      description: >
        Read-only RF-owned visibility for vouchers whose durable attribution fact is
        confirmed for the authenticated PRO. This endpoint does not expose voucher
        codes, raw user ids, share codes, attribution metadata, rewards, commissions
        or payout semantics.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: >
            Legacy compatibility filter by runtime `status`. Lifecycle reads should prefer
            response `canonicalStatus`; `claimed` maps to canonical `available`.
          schema:
            type: string
            enum: [claimed, redeemed, cancelled]
        - name: partnerId
          in: query
          required: false
          schema:
            type: string
        - name: claimScope
          in: query
          required: false
          schema:
            type: string
            enum: [partner, listing]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfProAttributedVouchersResponse"
        "400":
          $ref: "#/components/responses/RfValidationError"
        "401":
          $ref: "#/components/responses/RfUnauthorized"

  /v1/rf/pro/links/{proLinkId}/accept:
    post:
      tags: [rf]
      operationId: rfAcceptProLink
      summary: Accept PRO link by partner owner
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - $ref: "#/components/parameters/RfProLinkId"
      responses:
        "200":
          description: Accepted or already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfAcceptProLinkResponse"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "403":
          $ref: "#/components/responses/RfForbidden"
        "404":
          $ref: "#/components/responses/RfNotFound"
        "409":
          $ref: "#/components/responses/RfConflict"

  /v1/rf/pro/links/{proLinkId}/reject:
    post:
      tags: [rf]
      operationId: rfRejectProLink
      summary: Reject pending PRO link by partner owner
      description: >
        Owner-gated lifecycle operation. Pending links become ended. Already ended
        links return an idempotent response. Active links return conflict and must
        be ended instead. This operation does not affect offers, vouchers,
        claim/redeem attribution, rewards, commissions or payouts.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - $ref: "#/components/parameters/RfProLinkId"
      responses:
        "200":
          description: Rejected or already ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfAcceptProLinkResponse"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "403":
          $ref: "#/components/responses/RfForbidden"
        "404":
          $ref: "#/components/responses/RfNotFound"
        "409":
          $ref: "#/components/responses/RfConflict"

  /v1/rf/pro/links/{proLinkId}/end:
    post:
      tags: [rf]
      operationId: rfEndProLink
      summary: End active PRO link by partner owner
      description: >
        Owner-gated lifecycle operation. Active links become ended. Already ended
        links return an idempotent response. Pending links return conflict and
        should be rejected instead. This operation does not affect offers,
        vouchers, claim/redeem attribution, rewards, commissions or payouts.
      security:
        - GatewayAuth: []
      parameters:
        - $ref: "#/components/parameters/RfXGatewayAuth"
        - $ref: "#/components/parameters/RfProLinkId"
      responses:
        "200":
          description: Ended or already ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfAcceptProLinkResponse"
        "401":
          $ref: "#/components/responses/RfUnauthorized"
        "403":
          $ref: "#/components/responses/RfForbidden"
        "404":
          $ref: "#/components/responses/RfNotFound"
        "409":
          $ref: "#/components/responses/RfConflict"

components:
  securitySchemes:
    GatewayAuth:
      type: apiKey
      in: header
      name: X-Gateway-Auth

  parameters:
    RfXGatewayAuth:
      name: X-Gateway-Auth
      in: header
      required: true
      schema:
        type: string
    RfIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Required idempotency key for claim operation. Same user + same key replays the same
        claim result without creating duplicate business effects.
      schema:
        type: string
        minLength: 1
        maxLength: 160
    RfOptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Optional idempotency key for redeem operation. When provided, RF stores it on
        the redemption ledger row and still guarantees a single succeeded redemption per voucher.
      schema:
        type: string
        minLength: 1
        maxLength: 160
    RfPartnerId:
      name: partnerId
      in: path
      required: true
      schema:
        type: string
    RfPartnerItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    RfOfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
    RfRieltListingId:
      name: listingId
      in: path
      required: true
      schema:
        type: string
    RfVoucherId:
      name: voucherId
      in: path
      required: true
      schema:
        type: string
    RfProLinkId:
      name: proLinkId
      in: path
      required: true
      schema:
        type: string

  responses:
    RfUnauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RfErrorResponse"
    RfForbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RfErrorResponse"
    RfNotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RfErrorResponse"
    RfValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RfErrorResponse"
    RfConflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RfErrorResponse"
    RfRateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RfErrorResponse"
    RfInternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RfErrorResponse"
    RfServiceUnavailable:
      description: Service unavailable or not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RfErrorResponse"

  schemas:
    RfHealthResponse:
      type: object
      required: [service, env, status, version]
      properties:
        service:
          type: string
        env:
          type: string
        status:
          type: string
        version:
          type: string

    RfReadyResponse:
      type: object
      required: [service, env, status, version, checks, missing]
      properties:
        service:
          type: string
        env:
          type: string
        status:
          type: string
          enum: [ready, not_ready]
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
        missing:
          type: array
          items:
            type: string

    RfErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        requestId:
          type: string
          nullable: true

    RfPartner:
      type: object
      required:
        [id, slug, displayName, countryId, cityId, status, ownerUserId, createdAt, updatedAt]
      properties:
        id:
          type: string
        slug:
          type: string
        displayName:
          type: string
        countryId:
          type: string
        cityId:
          type: string
        atlasPlaceId:
          type: string
          nullable: true
        hostAtlasPlaceId:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        ownerUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RfOffer:
      type: object
      required:
        [id, partnerId, itemId, title, offerType, visibility, status, createdByUserId, createdAt, updatedAt]
      properties:
        id:
          type: string
        partnerId:
          type: string
        itemId:
          type: string
          nullable: true
        title:
          type: string
        offerType:
          type: string
          enum: [discount, bundle, gift, access, campaign, event_related]
        visibility:
          type: string
          enum: [public, pro_only, invite_only]
        status:
          type: string
          enum: [draft, active, archived]
        repeatPolicy:
          allOf:
            - $ref: "#/components/schemas/RfRepeatPolicy"
          description: >
            Offer-level repeatability policy. Missing value must be treated by clients
            as once_per_scope for backwards compatibility.
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RfPartnerItem:
      type: object
      required: [id, partnerId, title, description, category, priceFrom, currency, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        partnerId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        priceFrom:
          type: number
          nullable: true
          minimum: 0
        currency:
          type: string
          nullable: true
          minLength: 3
          maxLength: 3
        status:
          type: string
          enum: [active, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RfRieltListingSummary:
      type: object
      required: [id, title, rfPartnerId]
      properties:
        id:
          type: string
        title:
          type: string
        rfPartnerId:
          type: string
          nullable: true

    RfRieltListingOffer:
      allOf:
        - $ref: "#/components/schemas/RfOffer"
        - type: object
          required: [type, benefit, description, availability, applicabilityNote, priority]
          properties:
            type:
              type: string
              enum: [basic, premium]
            benefit:
              type: string
            description:
              type: string
              nullable: true
            availability:
              type: string
              enum: [available]
            applicabilityNote:
              type: string
              nullable: true
            priority:
              type: integer
              minimum: 0

    RfRieltListingOfferContext:
      type: object
      required: [listing, partner, offers]
      properties:
        listing:
          $ref: "#/components/schemas/RfRieltListingSummary"
        partner:
          anyOf:
            - $ref: "#/components/schemas/RfPartner"
            - type: "null"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/RfRieltListingOffer"

    RfVoucherCanonicalStatus:
      type: string
      enum: [available, locked, unlocked, redeemed, expired, cancelled]
      description: >
        Canonical RF Voucher Economy lifecycle status. During the transition window the
        legacy `status` field remains the backwards-compatible runtime status; if
        `canonicalStatus` is absent, clients may map `claimed` -> `available`,
        `redeemed` -> `redeemed`, and `cancelled` -> `cancelled`.

    RfRepeatPolicy:
      type: string
      enum: [once_per_scope, repeat_after_redeem]
      description: >
        RF repeatability policy. `once_per_scope` preserves the current one-time
        behavior; `repeat_after_redeem` allows a new voucher instance after a
        redeemed voucher when no active instance exists.

    RfClaimBlockReason:
      type: string
      enum: [existing_active_voucher, once_per_scope_consumed]
      description: Server-side reason why a claim returned an existing voucher instead of creating a new instance.

    RfAttributionStatus:
      type: string
      enum: [none, confirmed, rejected]

    RfAttributionSource:
      type: string
      enum: [pro_link, direct_offer, internal_navigation, unknown]

    RfClaimSource:
      type: string
      enum: [public_rf_catalog, public_offer_detail, rielt_offer_detail, pro_shared_link, unknown]

    RfClaimAttribution:
      type: object
      description: >
        Optional transient attribution payload. RF validates it server-side and writes
        immutable voucher attribution only on the first successful claim.
      required: [version, attributionSource, claimSource]
      properties:
        version:
          type: integer
          enum: [1]
        shareCode:
          type: string
          nullable: true
          description: Public RF share code. Never expose auth-provider user IDs in public URLs.
        attributionSource:
          $ref: "#/components/schemas/RfAttributionSource"
        claimSource:
          $ref: "#/components/schemas/RfClaimSource"
        capturedAt:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          description: Small, bounded, non-PII audit metadata.

    RfClaimVoucherRequest:
      type: object
      properties:
        attribution:
          nullable: true
          anyOf:
            - $ref: "#/components/schemas/RfClaimAttribution"
            - type: "null"

    RfVoucherAttribution:
      type: object
      required: [version, strategy, status, source, claimSource, shareCode, proUserId, proLinkId, capturedAt, confirmedAt, metadata]
      properties:
        version:
          type: integer
          minimum: 1
        strategy:
          type: string
          enum: [rf_pro_last_touch_before_claim]
        status:
          $ref: "#/components/schemas/RfAttributionStatus"
        source:
          $ref: "#/components/schemas/RfAttributionSource"
        claimSource:
          $ref: "#/components/schemas/RfClaimSource"
        shareCode:
          type: string
          nullable: true
        proUserId:
          type: string
          nullable: true
          description: Internal resolved PRO user id. Public URLs use shareCode instead.
        proLinkId:
          type: string
          nullable: true
        capturedAt:
          type: string
          format: date-time
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties: true

    RfVoucherRedemptionResultStatus:
      type: string
      enum: [succeeded, failed, duplicate]
      description: Result status for a voucher redemption attempt.

    RfVoucherRedemption:
      type: object
      description: >
        Prepared RF redemption record shape for audit/history. The current public RF API
        does not expose a list endpoint for redemption records yet.
      required:
        [id, voucherId, userId, partnerId, contextType, resultStatus, redeemedAt, metadata, createdAt, updatedAt]
      properties:
        id:
          type: string
        voucherId:
          type: string
        userId:
          type: string
        partnerId:
          type: string
        contextType:
          type: string
        contextRef:
          type: string
          nullable: true
        resultStatus:
          $ref: "#/components/schemas/RfVoucherRedemptionResultStatus"
        idempotencyKey:
          type: string
          nullable: true
        actorUserId:
          type: string
          nullable: true
        redeemedAt:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        correlationId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RfVoucher:
      type: object
      required:
        [
          id,
          offerId,
          partnerId,
          issuedToUserId,
          status,
          claimScope,
          listingContext,
          code,
          claimedAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        offerId:
          type: string
        partnerId:
          type: string
        issuedToUserId:
          type: string
        status:
          type: string
          enum: [claimed, redeemed, cancelled]
          description: >
            Runtime status truth for RF voucher lifecycle. `claimed` is the runtime value and maps
            to product semantic "issued" in UX/docs; no separate runtime `issued` enum exists.
        canonicalStatus:
          allOf:
            - $ref: "#/components/schemas/RfVoucherCanonicalStatus"
          description: >
            Primary lifecycle field for RF voucher runtime semantics. New runtime writes set this
            field consistently; clients should still keep legacy `status` fallback for backwards
            compatibility during the transition window.
        claimScope:
          type: string
          enum: [partner, listing]
          description: >
            Scope used for voucher uniqueness. Partner scope is unique by offer and user;
            listing scope is unique by Rielt listing, offer and user.
        listingContext:
          nullable: true
          anyOf:
            - type: object
              required: [source, listingId, listingTitle]
              properties:
                source:
                  type: string
                  enum: [rielt]
                listingId:
                  type: string
                listingTitle:
                  type: string
                  nullable: true
            - type: "null"
        code:
          type: string
        claimedAt:
          type: string
          format: date-time
        redeemedAt:
          type: string
          format: date-time
          nullable: true
        contractVersion:
          type: integer
          minimum: 1
          description: RF voucher contract/lifecycle version. Stage 1+2 runtime writes version 1.
        repeatPolicySnapshot:
          allOf:
            - $ref: "#/components/schemas/RfRepeatPolicy"
          description: Repeat policy captured on this voucher instance at claim time.
        issueSequence:
          type: integer
          minimum: 1
          description: Monotonic voucher instance sequence within the normalized claim scope.
        expiresAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        statusChangedAt:
          type: string
          format: date-time
          nullable: true
        statusReason:
          type: string
          nullable: true
        statusActorUserId:
          type: string
          nullable: true
        attribution:
          $ref: "#/components/schemas/RfVoucherAttribution"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        offer:
          type: object
          description: Optional wallet read enrichment for human-readable voucher display.
          required: [id, title, benefit, terms, type]
          properties:
            id:
              type: string
            title:
              type: string
            benefit:
              type: string
            terms:
              type: string
            type:
              type: string
        partner:
          type: object
          description: Optional wallet read enrichment for human-readable partner display.
          required: [id, displayName]
          properties:
            id:
              type: string
            displayName:
              type: string
            cityId:
              type: string
              nullable: true
            countryId:
              type: string
              nullable: true
        validityLabel:
          type: string
          description: Optional human-readable validity note for wallet display.
        usage:
          type: object
          description: Optional human-readable usage guidance for wallet display.
          required: [instruction, contactHint, redeemStatus]
          properties:
            instruction:
              type: string
            contactHint:
              type: string
            redeemStatus:
              type: string

    RfInternalDiagnosticsAnomalySeverity:
      type: string
      enum: [info, warning, critical]

    RfInternalDiagnosticsAnomaly:
      type: object
      required: [code, severity, message, evidence]
      properties:
        code:
          type: string
        severity:
          $ref: "#/components/schemas/RfInternalDiagnosticsAnomalySeverity"
        message:
          type: string
        evidence:
          type: object
          additionalProperties: true

    RfInternalVoucherDiagnosticsVoucher:
      type: object
      required:
        [
          voucherId,
          offerId,
          partnerId,
          issuedToUserId,
          claimScope,
          listingId,
          listingTitleSnapshot,
          status,
          canonicalStatus,
          contractVersion,
          repeatPolicySnapshot,
          issueSequence,
          claimedAt,
          redeemedAt,
          cancelledAt,
          expiresAt,
          statusChangedAt,
          statusReason,
          statusActorUserId,
          codeMasked,
        ]
      properties:
        voucherId:
          type: string
        offerId:
          type: string
        partnerId:
          type: string
        issuedToUserId:
          type: string
        claimScope:
          type: string
          enum: [partner, listing]
        listingId:
          type: string
          nullable: true
        listingTitleSnapshot:
          type: string
          nullable: true
        status:
          type: string
          enum: [claimed, redeemed, cancelled]
        canonicalStatus:
          $ref: "#/components/schemas/RfVoucherCanonicalStatus"
        contractVersion:
          type: integer
          minimum: 1
        repeatPolicySnapshot:
          $ref: "#/components/schemas/RfRepeatPolicy"
        issueSequence:
          type: integer
          minimum: 1
        claimedAt:
          type: string
          format: date-time
        redeemedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        statusChangedAt:
          type: string
          format: date-time
          nullable: true
        statusReason:
          type: string
          nullable: true
        statusActorUserId:
          type: string
          nullable: true
        codeMasked:
          type: string
          nullable: true

    RfInternalVoucherDiagnosticsOfferRelation:
      type: object
      required: [id, partnerId, status, visibility, repeatPolicy]
      properties:
        id:
          type: string
        partnerId:
          type: string
        status:
          type: string
          enum: [draft, active, archived]
        visibility:
          type: string
          enum: [public, pro_only, invite_only]
        repeatPolicy:
          $ref: "#/components/schemas/RfRepeatPolicy"

    RfInternalVoucherDiagnosticsPartnerRelation:
      type: object
      required: [id, status, ownerUserId]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [active, archived]
        ownerUserId:
          type: string

    RfInternalVoucherDiagnosticsListingMappingRelation:
      type: object
      required: [listingId, offerId, partnerId, status, offerKind, priority]
      properties:
        listingId:
          type: string
        offerId:
          type: string
        partnerId:
          type: string
        status:
          type: string
          enum: [active, hidden]
        offerKind:
          type: string
          enum: [basic, premium]
        priority:
          type: integer

    RfInternalVoucherDiagnosticsProLinkRelation:
      type: object
      required: [id, partnerId, proUserId, status, shareCodeMasked]
      properties:
        id:
          type: string
        partnerId:
          type: string
        proUserId:
          type: string
        status:
          type: string
          enum: [pending, active, ended]
        shareCodeMasked:
          type: string
          nullable: true

    RfInternalVoucherDiagnosticsRelations:
      type: object
      required: [offer, partner, listingMapping, proLink]
      properties:
        offer:
          anyOf:
            - $ref: "#/components/schemas/RfInternalVoucherDiagnosticsOfferRelation"
            - type: "null"
        partner:
          anyOf:
            - $ref: "#/components/schemas/RfInternalVoucherDiagnosticsPartnerRelation"
            - type: "null"
        listingMapping:
          anyOf:
            - $ref: "#/components/schemas/RfInternalVoucherDiagnosticsListingMappingRelation"
            - type: "null"
        proLink:
          anyOf:
            - $ref: "#/components/schemas/RfInternalVoucherDiagnosticsProLinkRelation"
            - type: "null"

    RfInternalVoucherDiagnosticsRedemptionItem:
      type: object
      required: [id, voucherId, resultStatus, actorUserId, redeemedAt, createdAt, idempotencyKeyFingerprint, correlationIdMasked]
      properties:
        id:
          type: string
        voucherId:
          type: string
        resultStatus:
          $ref: "#/components/schemas/RfVoucherRedemptionResultStatus"
        actorUserId:
          type: string
          nullable: true
        redeemedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        idempotencyKeyFingerprint:
          type: string
          nullable: true
        correlationIdMasked:
          type: string
          nullable: true

    RfInternalVoucherDiagnosticsRedemption:
      type: object
      required: [items, hasSuccessfulRedemption, successfulRedemptionCount, totalRedemptionAttempts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RfInternalVoucherDiagnosticsRedemptionItem"
        hasSuccessfulRedemption:
          type: boolean
        successfulRedemptionCount:
          type: integer
          minimum: 0
        totalRedemptionAttempts:
          type: integer
          minimum: 0

    RfInternalVoucherDiagnosticsConsumptionGuard:
      type: object
      required: [exists, offerId, issuedToUserId, claimScope, scopeRef, consumedVoucherId, repeatPolicySnapshot, consumedAt]
      properties:
        exists:
          type: boolean
        offerId:
          type: string
          nullable: true
        issuedToUserId:
          type: string
          nullable: true
        claimScope:
          type: string
          enum: [partner, listing]
          nullable: true
        scopeRef:
          type: string
          nullable: true
        consumedVoucherId:
          type: string
          nullable: true
        repeatPolicySnapshot:
          allOf:
            - $ref: "#/components/schemas/RfRepeatPolicy"
          nullable: true
        consumedAt:
          type: string
          format: date-time
          nullable: true

    RfInternalVoucherDiagnosticsAttribution:
      type: object
      required:
        [
          attributionVersion,
          attributionStrategy,
          attributionStatus,
          attributionSource,
          claimSource,
          proAttributedUserId,
          proLinkId,
          attributionConfirmedAt,
          attributionCapturedAt,
          attributionRejectedReason,
          metadataKeys,
        ]
      properties:
        attributionVersion:
          type: integer
          minimum: 1
        attributionStrategy:
          type: string
          enum: [rf_pro_last_touch_before_claim]
        attributionStatus:
          $ref: "#/components/schemas/RfAttributionStatus"
        attributionSource:
          $ref: "#/components/schemas/RfAttributionSource"
        claimSource:
          $ref: "#/components/schemas/RfClaimSource"
        proAttributedUserId:
          type: string
          nullable: true
        proLinkId:
          type: string
          nullable: true
        attributionConfirmedAt:
          type: string
          format: date-time
          nullable: true
        attributionCapturedAt:
          type: string
          format: date-time
          nullable: true
        attributionRejectedReason:
          type: string
          nullable: true
        metadataKeys:
          type: array
          items:
            type: string

    RfInternalVoucherDiagnosticsIdempotencyBinding:
      type: object
      required: [operation, actorUserId, voucherId, createdAt, idempotencyKeyFingerprint]
      properties:
        operation:
          type: string
          enum: [voucher_claim]
        actorUserId:
          type: string
        voucherId:
          type: string
        createdAt:
          type: string
          format: date-time
        idempotencyKeyFingerprint:
          type: string

    RfInternalVoucherDiagnosticsIdempotency:
      type: object
      required: [claimBindings]
      properties:
        claimBindings:
          type: array
          items:
            $ref: "#/components/schemas/RfInternalVoucherDiagnosticsIdempotencyBinding"

    RfInternalVoucherDiagnosticsResponse:
      type: object
      required: [voucher, relations, redemption, consumptionGuard, attribution, idempotency, anomalies]
      properties:
        voucher:
          $ref: "#/components/schemas/RfInternalVoucherDiagnosticsVoucher"
        relations:
          $ref: "#/components/schemas/RfInternalVoucherDiagnosticsRelations"
        redemption:
          $ref: "#/components/schemas/RfInternalVoucherDiagnosticsRedemption"
        consumptionGuard:
          $ref: "#/components/schemas/RfInternalVoucherDiagnosticsConsumptionGuard"
        attribution:
          $ref: "#/components/schemas/RfInternalVoucherDiagnosticsAttribution"
        idempotency:
          $ref: "#/components/schemas/RfInternalVoucherDiagnosticsIdempotency"
        anomalies:
          type: array
          items:
            $ref: "#/components/schemas/RfInternalDiagnosticsAnomaly"

    RfProLink:
      type: object
      required: [id, partnerId, proUserId, shareCode, status, roleScope, createdAt, updatedAt]
      properties:
        id:
          type: string
        partnerId:
          type: string
        proUserId:
          type: string
        shareCode:
          type: string
          nullable: true
          description: Public RF share code used for PRO attribution links. It is not an auth-provider user id.
        status:
          type: string
          enum: [pending, active, ended]
        roleScope:
          type: string
          enum: [onboarding, curation, promotion, moderation_support, account_support]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RfPartnerListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RfPartner"
        nextCursor:
          type: string
          nullable: true

    RfOfferListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RfOffer"
        nextCursor:
          type: string
          nullable: true

    RfPartnerItemListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RfPartnerItem"
        nextCursor:
          type: string
          nullable: true

    RfVoucherListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RfVoucher"
        nextCursor:
          type: string
          nullable: true

    RfProAttributedVoucher:
      type: object
      description: >
        PRO-safe read-only attribution visibility DTO. It intentionally omits voucher
        code, issuedToUserId, raw PRO user ids, share codes and attribution metadata.
      required:
        [
          voucherId,
          offerId,
          offerTitle,
          partnerId,
          partnerName,
          status,
          canonicalStatus,
          claimScope,
          listingContext,
          attributionStatus,
          attributionSource,
          claimSource,
          attributionConfirmedAt,
          claimedAt,
          redeemedAt,
        ]
      properties:
        voucherId:
          type: string
        offerId:
          type: string
        offerTitle:
          type: string
        partnerId:
          type: string
        partnerName:
          type: string
        status:
          type: string
          enum: [claimed, redeemed, cancelled]
        canonicalStatus:
          $ref: "#/components/schemas/RfVoucherCanonicalStatus"
        claimScope:
          type: string
          enum: [partner, listing]
        listingContext:
          nullable: true
          anyOf:
            - type: object
              required: [source, listingId, listingTitle]
              properties:
                source:
                  type: string
                  enum: [rielt]
                listingId:
                  type: string
                listingTitle:
                  type: string
                  nullable: true
            - type: "null"
        attributionStatus:
          type: string
          enum: [confirmed]
        attributionSource:
          $ref: "#/components/schemas/RfAttributionSource"
        claimSource:
          $ref: "#/components/schemas/RfClaimSource"
        attributionConfirmedAt:
          type: string
          format: date-time
        claimedAt:
          type: string
          format: date-time
        redeemedAt:
          type: string
          format: date-time
          nullable: true

    RfProAttributedVouchersResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RfProAttributedVoucher"
        nextCursor:
          type: string
          nullable: true

    RfVoucherSummary:
      type: object
      required: [totalVouchers, activeVouchers, usedVouchers, cancelledVouchers, expiredVouchers]
      properties:
        totalVouchers:
          type: integer
          minimum: 0
        activeVouchers:
          type: integer
          minimum: 0
          description: Count of active/non-terminal vouchers. Runtime prefers canonical available/locked/unlocked with legacy claimed fallback.
        usedVouchers:
          type: integer
          minimum: 0
          description: Count of redeemed vouchers. Runtime prefers canonical redeemed with legacy redeemed fallback.
        cancelledVouchers:
          type: integer
          minimum: 0
          description: Count of cancelled vouchers. Runtime prefers canonical cancelled with legacy cancelled fallback.
        expiredVouchers:
          type: integer
          minimum: 0
          description: Count of expired vouchers using canonical lifecycle status.

    RfProLinkListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RfProLink"
        nextCursor:
          type: string
          nullable: true

    RfClaimResponse:
      type: object
      required: [voucher, idempotentReplay]
      properties:
        voucher:
          $ref: "#/components/schemas/RfVoucher"
        idempotentReplay:
          type: boolean
        createdNewInstance:
          type: boolean
          description: True when this claim created a new voucher instance. False for idempotent replay or existing-voucher returns.
        claimBlockReason:
          nullable: true
          anyOf:
            - $ref: "#/components/schemas/RfClaimBlockReason"
            - type: "null"
        repeatPolicy:
          $ref: "#/components/schemas/RfRepeatPolicy"

    RfRedeemResponse:
      type: object
      required: [voucher, applied]
      properties:
        voucher:
          $ref: "#/components/schemas/RfVoucher"
        applied:
          type: boolean

    RfAcceptProLinkResponse:
      type: object
      required: [proLink, applied]
      properties:
        proLink:
          $ref: "#/components/schemas/RfProLink"
        applied:
          type: boolean

