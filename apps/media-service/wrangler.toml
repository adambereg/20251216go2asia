name = "go2asia-media-service"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["global_fetch_strictly_public"]

[env.production]
name = "go2asia-media-service"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "go2asia-media"

[[env.production.r2_buckets]]
binding = "SPACE_MEDIA_BUCKET"
bucket_name = "go2asiaspace"

[env.staging]
name = "go2asia-media-service-staging"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "go2asia-media"

[[env.staging.r2_buckets]]
binding = "SPACE_MEDIA_BUCKET"
bucket_name = "go2asiaspace"

# Required vars/secrets:
# - SERVICE_JWT_SECRET
# - MEDIA_UPLOAD_SIGNING_SECRET
# - DATABASE_URL
# Optional:
# - MEDIA_PUBLIC_BASE_URL
# - MEDIA_MAX_BYTES
# - MEDIA_BUCKET_NAME, SPACE_MEDIA_BUCKET_NAME
