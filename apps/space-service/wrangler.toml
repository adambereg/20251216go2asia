name = "go2asia-space-service"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["global_fetch_strictly_public"]

[env.production]
name = "go2asia-space-service"

[env.staging]
name = "go2asia-space-service-staging"

# Required vars/secrets:
# - SERVICE_JWT_SECRET
# - DATABASE_URL
# - MEDIA_SERVICE_URL
# Optional:
# - SPACE_POSTS_PER_HOUR
# - SPACE_REPOSTS_PER_MINUTE
# - SPACE_MAX_MEDIA_ATTACHMENTS
# - SPACE_MAX_TEXT_LENGTH
