name = "go2asia-points-service"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[env.production]
name = "go2asia-points-service"

[env.staging]
name = "go2asia-points-service-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
POINTS_ENABLE_SPENDABILITY_SHADOW_COMPARE = "true"
POINTS_ENABLE_SPENDABILITY_SHADOW_DIAGNOSTICS = "true"
POINTS_ENABLE_SPENDABILITY_DURABLE_EXPORT = "true"

# Runtime vars:
# - ENVIRONMENT and staging spendability flags are pinned above so dashboard-only edits do not drift on deploy.
# - VERSION is injected by CI/CD as the git sha.
#
# Required vars/secrets/bindings for Milestone 3:
# - DATABASE_URL (var/secret)
# - SERVICE_JWT_SECRET (secret, shared with api-gateway for gateway-origin auth and service-to-service auth)
#
# Optional config (vars):
# - POINTS_VELOCITY_CAP
# - POINTS_VELOCITY_WINDOW_SECONDS
